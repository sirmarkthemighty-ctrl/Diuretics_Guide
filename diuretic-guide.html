al daily dose","ยาลูปฉีด: furosemide 20–40 มก. ถ้าเริ่มใหม่ หรือ 1–2 เท่าของขนาดยากินต่อวัน"],add:["Thiazide-type (ESC IIa B); metolazone or acetazolamide may be considered","ไทอะไซด์ (ESC IIa B) พิจารณา metolazone หรือ acetazolamide"],watch:["Urine Na above 50–70 mEq/L at 2 h or output above 100–150 mL/h in 6 h; creatinine and electrolytes every 24 h","โซเดียมปัสสาวะมากกว่า 50–70 mEq/L ที่ 2 ชม. หรือปัสสาวะมากกว่า 100–150 mL/ชม. ใน 6 ชม. และ creatinine กับเกลือแร่ทุก 24 ชม."],avoid:["A single daily IV bolus; discharge with congestion left","ฉีดวันละครั้งเดียว และให้กลับบ้านทั้งที่ยังมีน้ำเกินค้าง"]},items:[{t:["Intravenous loop diuretic is the first choice for signs or symptoms of fluid overload.","ยาขับปัสสาวะกลุ่มลูปชนิดฉีดเข้าหลอดเลือดดำเป็นยาแรกเมื่อมีอาการหรืออาการแสดงของภาวะน้ำเกิน"],s:"esc21",c:"I C",also:[{s:"thhf",c:"I C"}],h:"first"},{t:["Not on a diuretic before: furosemide 20–40 mg IV, or a torsemide 10–20 mg IV bolus. Already on an oral diuretic: IV dose of 1–2 times the daily oral dose.","ไม่เคยได้ยาขับปัสสาวะ: furosemide 20–40 มก. ฉีดเข้าหลอดเลือดดำ หรือ torsemide 10–20 มก. ฉีดครั้งเดียว ถ้าได้ยากินอยู่แล้ว: ฉีดขนาด 1–2 เท่าของขนาดยากินต่อวัน"],s:"esc21",h:"dose"},{t:["Thai guideline: not on a diuretic before: furosemide 20–40 mg IV; already on one: first IV dose equal to the oral dose.","แนวทางไทย: ไม่เคยได้ยา: furosemide 20–40 มก. ฉีดเข้าหลอดเลือดดำ ถ้าได้ยาอยู่แล้ว: ฉีดครั้งแรกขนาดเทียบเท่าขนาดยากินเดิม"],s:"thhf",c:"I B",h:"dose"},{t:["Give as 2–3 boluses a day or a continuous infusion. A single daily bolus is discouraged because sodium is retained after the dose.","ให้เป็นการฉีดวันละ 2–3 ครั้ง หรือหยดต่อเนื่อง ไม่แนะนำให้ฉีดวันละครั้งเดียวเพราะหลังหมดฤทธิ์ยาจะมีการเก็บโซเดียมกลับ"],s:"esc21",h:"dose"},{t:["Bolus or continuous infusion are both acceptable; consider changing bolus to continuous infusion if the response is poor.","ฉีดครั้งหรือหยดต่อเนื่องได้ทั้งสองแบบ และพิจารณาเปลี่ยนจากฉีดเป็นครั้งเป็นหยดต่อเนื่องเมื่อตอบสนองไม่ดี"],s:"thhf",c:"I C / IIa C",h:"dose"},{t:["Check the response early: spot urine sodium above 50–70 mEq/L at 2 h and/or urine output above 100–150 mL/h in the first 6 h. If not reached, double the IV dose.","ประเมินการตอบสนองเร็ว: โซเดียมในปัสสาวะครั้งเดียวมากกว่า 50–70 mEq/L ที่ 2 ชั่วโมง และ/หรือปัสสาวะมากกว่า 100–150 mL/ชม. ใน 6 ชั่วโมงแรก ถ้าไม่ถึงให้เพิ่มขนาดยาฉีดเป็น 2 เท่า"],s:"esc21",p:"Fig. 13",h:"titr"},{t:["If there is no response, increase the dose and reassess volume status and tissue perfusion.","ถ้าไม่ตอบสนอง ให้เพิ่มขนาดยา และประเมิน volume status และ tissue perfusion ซ้ำ"],s:"thhf",c:"I B",h:"titr"},{t:["Usual ceiling for IV furosemide: 400–600 mg a day; up to 1,000 mg may be considered in severe kidney impairment.","ขนาดสูงสุดทั่วไปของ furosemide ฉีด: 400–600 มก./วัน และอาจถึง 1,000 มก. ในผู้ป่วยไตเสื่อมรุนแรง"],s:"esc21",p:"Fig. 13",h:"titr"},{t:["Add a thiazide-type diuretic for resistant oedema that does not respond to a higher loop dose.","เพิ่มยากลุ่มไทอะไซด์เมื่อบวมดื้อและไม่ตอบสนองต่อการเพิ่มขนาดยาลูป"],s:"esc21",c:"IIa B",h:"add"},{t:["A second diuretic acting elsewhere (thiazide, metolazone or acetazolamide) may be considered; this needs careful monitoring of electrolytes and kidney function. The step-by-step algorithm is expert opinion.","อาจพิจารณายาอีกตัวที่ออกฤทธิ์คนละตำแหน่ง (ไทอะไซด์ metolazone หรือ acetazolamide) ต้องติดตามเกลือแร่และการทำงานของไตอย่างใกล้ชิด ขั้นตอนนี้เป็นความเห็นผู้เชี่ยวชาญ"],s:"esc21",h:"add"},{t:["Add a thiazide or spironolactone when the response is less than expected.","พิจารณาเพิ่มยากลุ่มไทอะไซด์หรือ spironolactone เมื่อตอบสนองน้อยกว่าที่ควร"],s:"thhf",c:"IIa C",h:"add"},{t:["Tolvaptan may be considered in volume overload and/or hyponatremia.","พิจารณาใช้ tolvaptan เมื่อมีภาวะน้ำเกินและ/หรือโซเดียมในเลือดต่ำ"],s:"thhf",c:"IIa B",h:"add"},{t:["Sodium under 2 g a day if congestion is hard to control or keeps returning despite diuretics.","จำกัดโซเดียมต่ำกว่า 2 กรัม/วัน เมื่อควบคุมภาวะน้ำเกินยากหรือเป็นซ้ำบ่อยแม้ได้ยาขับปัสสาวะเหมาะสมแล้ว"],s:"thhf",c:"I C",h:"add"},{t:["Acetazolamide 500 mg IV once a day added to the loop diuretic (ADVOR): decongestion within 3 days in 42.2% vs 30.5% (RR 1.46); hospital stay 8.8 vs 9.9 days; no difference in other outcomes or adverse events. More outcome and safety data are needed, so no new recommendation was made.","การเพิ่ม acetazolamide 500 มก. ฉีดวันละครั้งร่วมกับยาลูป (ADVOR): ขจัดภาวะน้ำเกินใน 3 วันได้ 42.2% เทียบ 30.5% (RR 1.46) นอนโรงพยาบาล 8.8 เทียบ 9.9 วัน ผลลัพธ์อื่นและเหตุการณ์ไม่พึงประสงค์ไม่ต่างกัน ยังต้องการข้อมูลผลลัพธ์และความปลอดภัยเพิ่ม จึงยังไม่มีข้อแนะนำใหม่"],s:"esc23",h:"trial"},{t:["Hydrochlorothiazide 25–100 mg a day (by eGFR) added to IV furosemide (CLOROTIC): weight change −2.3 vs −1.5 kg at 72 h; dyspnoea similar; creatinine rose in 46.5% vs 17.2%. No effect on clinical outcomes, so no recommendation was made.","การเพิ่ม hydrochlorothiazide 25–100 มก./วัน (ตาม eGFR) ร่วมกับ furosemide ฉีด (CLOROTIC): น้ำหนักลด 2.3 เทียบ 1.5 กก. ที่ 72 ชั่วโมง อาการเหนื่อยไม่ต่างกัน creatinine เพิ่มใน 46.5% เทียบ 17.2% ไม่มีผลต่อผลลัพธ์ทางคลินิก จึงไม่มีข้อแนะนำ"],s:"esc23",h:"trial"},{t:["While on IV diuretics, check urine output, weight, kidney function and electrolytes every day (Thai); creatinine and electrolytes at least every 24 h (ESC).","ระหว่างให้ยาขับปัสสาวะทางหลอดเลือดดำ ติดตามปริมาณปัสสาวะ น้ำหนัก การทำงานของไต และเกลือแร่ทุกวัน (แนวทางไทย) และ creatinine กับเกลือแร่อย่างน้อยทุก 24 ชั่วโมง (ESC)"],s:"thhf",c:"I C",h:"mon"},{t:["After decongestion, continue an oral loop diuretic at the lowest dose that avoids congestion, and lower the IV dose as the fluid balance turns negative. Do not discharge with persistent congestion.","เมื่อหายน้ำเกินแล้วให้ยาลูปชนิดกินขนาดต่ำที่สุดที่ไม่ทำให้กลับมาบวม และลดขนาดยาฉีดลงเมื่อสมดุลน้ำเป็นลบ ไม่ควรให้กลับบ้านทั้งที่ยังมีภาวะน้ำเกินค้าง"],s:"esc21",h:"after"}]},{k:"hf_chronic",n:["Heart failure: long-term treatment","หัวใจล้มเหลวเรื้อรัง"],color:"border-l-orange-500",ids:["furosemide","torsemide","bumetanide","spironolactone","eplerenone","dapagliflozin","empagliflozin","hctz"],sh:["Chronic HF","HF เรื้อรัง"],qa:{first:["Loop diuretic for congestion (I C), at the lowest dose that keeps euvolaemia","ยาลูปเมื่อมีน้ำเกิน (I C) ขนาดต่ำสุดที่ยังไม่บวม"],add:["MRA in HFrEF (I A); loop plus thiazide for resistance, with care","MRA ใน HFrEF (I A) ยาลูปร่วมไทอะไซด์เมื่อดื้อยา ด้วยความระมัดระวัง"],watch:["Potassium 7 days after an MRA dose increase, then every 3 months","โพแทสเซียม 7 วันหลังเพิ่มขนาด MRA แล้วตรวจทุก 3 เดือน"],avoid:["Spironolactone 50 mg a day or more; MRA with ACEI and ARB together; starting at K above 5.0 or eGFR below 30","spironolactone ตั้งแต่ 50 มก./วัน ใช้ MRA ร่วมกับ ACEI และ ARB พร้อมกัน และเริ่มเมื่อ K สูงกว่า 5.0 หรือ eGFR ต่ำกว่า 30"]},items:[{t:["High blood pressure in HFrEF: a thiazide diuretic is one of the safe options.","ความดันโลหิตสูงใน HFrEF: ยากลุ่มไทอะไซด์เป็นตัวเลือกที่ปลอดภัยตัวหนึ่ง"],s:"thhf",p:"p. 37",h:"over"},{t:["Diuretics are recommended in HFrEF with signs or symptoms of congestion, to relieve symptoms, improve exercise capacity and reduce HF hospitalizations.","แนะนำให้ใช้ยาขับปัสสาวะใน HFrEF ที่มีอาการหรืออาการแสดงของภาวะน้ำเกิน เพื่อลดอาการ เพิ่มความสามารถในการออกกำลัง และลดการนอนโรงพยาบาล"],s:"esc21",c:"I C",h:"first"},{t:["Also recommended in congested HFmrEF and HFpEF to relieve symptoms and signs.","แนะนำเช่นเดียวกันใน HFmrEF และ HFpEF ที่มีภาวะน้ำเกิน"],s:"esc21",c:"I C",h:"first"},{t:["Aim for euvolaemia with the lowest diuretic dose; in some euvolaemic or hypovolaemic patients the diuretic can be reduced or stopped. Teach patients to adjust the dose from symptoms and daily weight.","เป้าหมายคือไม่มีน้ำเกินด้วยยาขนาดต่ำที่สุด ผู้ป่วยบางรายที่ไม่มีน้ำเกินหรือขาดน้ำอาจลดหรือหยุดยาได้ ควรสอนให้ปรับขนาดยาเองตามอาการและน้ำหนักที่ชั่งทุกวัน"],s:"esc21",h:"dose"},{t:["Loop and thiazide diuretics act together (sequential nephron blockade) and can treat diuretic resistance, but adverse effects are more likely, so use the combination with care.","ยาลูปและไทอะไซด์ออกฤทธิ์เสริมกัน (sequential nephron blockade) ใช้แก้ภาวะดื้อยาได้ แต่ผลข้างเคียงมากขึ้น จึงควรใช้ด้วยความระมัดระวัง"],s:"esc21",h:"add"},{t:["An MRA is recommended in HFrEF to reduce HF hospitalization and death. Spironolactone: start 25 mg once a day, target 50 mg once a day. Eplerenone: start 25 mg, target 50 mg once a day.","แนะนำ MRA ใน HFrEF เพื่อลดการนอนโรงพยาบาลและการเสียชีวิต spironolactone: เริ่ม 25 มก. วันละครั้ง เป้าหมาย 50 มก. วันละครั้ง eplerenone: เริ่ม 25 มก. เป้าหมาย 50 มก. วันละครั้ง"],s:"esc21",c:"I A",also:[{s:"thhf",c:"I A"}],h:"add"},{t:["MRA safety (Thai): check potassium at least 7 days after a dose increase and at least every 3 months when stable; avoid spironolactone 50 mg a day or more; do not combine MRA with both ACEI and ARB; do not start if creatinine is above 2.5 mg/dL (men) or 2.0 mg/dL (women), eGFR is below 30, or potassium is above 5.0 mmol/L; check potassium more often if a potassium supplement is needed.","ความปลอดภัยของ MRA (แนวทางไทย): ตรวจโพแทสเซียมอย่างช้า 7 วันหลังเพิ่มขนาดยา และทุก 3 เดือนเป็นอย่างต่ำเมื่อคงที่ หลีกเลี่ยง spironolactone ตั้งแต่ 50 มก./วัน ห้ามใช้ MRA ร่วมกับ ACEI และ ARB พร้อมกัน ไม่เริ่มยาถ้า creatinine สูงกว่า 2.5 มก./ดล. (ชาย) หรือ 2.0 มก./ดล. (หญิง) eGFR ต่ำกว่า 30 หรือโพแทสเซียมสูงกว่า 5.0 มิลลิโมล/ลิตร และตรวจโพแทสเซียมถี่ขึ้นเมื่อจำเป็นต้องให้โพแทสเซียมเสริม"],s:"thhf",p:"p. 23",h:"safe"},{t:["SGLT2 inhibitors can interact with loop diuretics: the doses of either may need adjusting. Stop SGLT2 inhibitors and diuretics temporarily, and give fluid and sodium, in clinical hypovolaemia or ketoacidosis.","ยากลุ่ม SGLT2 inhibitors อาจมีปฏิกิริยากับยาลูป อาจต้องปรับขนาดยาทั้งสองกลุ่ม ให้หยุด SGLT2 inhibitors และยาขับปัสสาวะชั่วคราวและให้น้ำและโซเดียมเมื่อมีภาวะขาดน้ำหรือ ketoacidosis"],s:"hfa19",h:"safe"}]},{k:"ascites",n:["Cirrhosis with ascites","ตับแข็งที่มีท้องมาน"],color:"border-l-amber-500",ids:["spironolactone","furosemide","torsemide","bumetanide","eplerenone","amiloride"],sh:["Ascites","ท้องมาน"],qa:{first:["Sodium 2 g a day plus spironolactone with or without furosemide (start 100 mg and 40 mg)","โซเดียม 2 กรัม/วัน ร่วมกับ spironolactone และ/หรือ furosemide (เริ่ม 100 มก. และ 40 มก.)"],add:["Torsemide or bumetanide if furosemide response is poor; large-volume paracentesis with albumin for tense ascites","torsemide หรือ bumetanide เมื่อตอบสนองต่อ furosemide ไม่ดี และเจาะระบายปริมาณมากพร้อมอัลบูมินเมื่อท้องตึง"],watch:["Weight (up to 0.5 kg a day without oedema), creatinine, sodium; spot urine Na/K ratio","น้ำหนัก (ไม่เกิน 0.5 กก./วันถ้าไม่บวม) creatinine โซเดียม และอัตราส่วน Na/K ในปัสสาวะ"],avoid:["NSAIDs, ACE inhibitors, ARBs; diuretics in AKI or hypovolaemic hyponatremia","NSAIDs, ACE inhibitors, ARBs และยาขับปัสสาวะเมื่อมีไตวายเฉียบพลันหรือโซเดียมต่ำจากขาดน้ำ"]},items:[{t:["Moderate sodium restriction (2 g or 90 mmol a day) plus diuretics are first-line for grade 2 ascites. Fluid restriction is not needed unless serum sodium is 125 mmol/L or less.","จำกัดโซเดียมปานกลาง (2 กรัม หรือ 90 mmol/วัน) ร่วมกับยาขับปัสสาวะเป็นการรักษาแรกของท้องมานระดับ 2 ไม่ต้องจำกัดน้ำ เว้นแต่โซเดียมในเลือด 125 mmol/L หรือต่ำกว่า"],s:"aasld",p:"p. 1018–1019",h:"first"},{t:["Spironolactone with or without furosemide. A first episode may respond to an aldosterone antagonist alone; long-standing ascites responds better to the combination.","spironolactone ร่วมกับ furosemide หรือไม่ก็ได้ ท้องมานครั้งแรกอาจตอบสนองต่อยากลุ่มต้านอัลโดสเตอโรนอย่างเดียว ส่วนท้องมานเรื้อรังตอบสนองดีกว่าด้วยยาร่วมกัน"],s:"aasld",h:"first"},{t:["Spironolactone: start 100 mg a day, raise stepwise up to 400 mg a day, at least 72 hours between steps (long half-life).","spironolactone: เริ่ม 100 มก./วัน ปรับเพิ่มทีละขั้นได้ถึง 400 มก./วัน ห่างกันอย่างน้อย 72 ชั่วโมง (ครึ่งชีวิตยาว)"],s:"aasld",h:"dose"},{t:["Furosemide: start 40 mg a day, raise according to response up to 160 mg a day, the usual threshold for calling the ascites refractory. Torsemide or bumetanide may improve natriuresis if the response to furosemide is poor.","furosemide: เริ่ม 40 มก./วัน ปรับเพิ่มตามการตอบสนองได้ถึง 160 มก./วัน ซึ่งเป็นเกณฑ์ที่ใช้บอกว่าท้องมานดื้อต่อการรักษา torsemide หรือ bumetanide อาจช่วยเพิ่มการขับโซเดียมเมื่อตอบสนองต่อ furosemide ไม่ดี"],s:"aasld",h:"dose"},{t:["In chronic kidney disease use higher loop-diuretic and lower aldosterone-antagonist doses.","ในโรคไตเรื้อรังใช้ยาลูปขนาดสูงขึ้นและยาต้านอัลโดสเตอโรนขนาดต่ำลง"],s:"aasld",h:"dose"},{t:["Weight loss target: up to 0.5 kg a day without peripheral oedema, up to 1 kg a day with oedema. Faster loss risks volume contraction, kidney failure and hyponatremia.","เป้าหมายน้ำหนักลด: ไม่เกิน 0.5 กก./วันถ้าไม่มีบวมที่ขา และไม่เกิน 1 กก./วันถ้ามีบวม ลดเร็วกว่านี้เสี่ยงขาดน้ำในหลอดเลือด ไตวาย และโซเดียมต่ำ"],s:"aasld",h:"titr"},{t:["Once the ascites is controlled, taper to the lowest dose that keeps it minimal or absent.","เมื่อควบคุมท้องมานได้แล้ว ลดยาลงเหลือขนาดต่ำที่สุดที่ยังคุมได้"],s:"aasld",h:"titr"},{t:["Tense (grade 3) ascites: large-volume paracentesis with albumin first, then start sodium restriction and diuretics.","ท้องมานตึง (ระดับ 3): เจาะระบายปริมาณมากพร้อมให้อัลบูมินก่อน แล้วจึงเริ่มจำกัดโซเดียมและให้ยาขับปัสสาวะ"],s:"aasld",h:"add"},{t:["Monitor body weight, serum creatinine and sodium, especially in the first weeks. A spot urine Na/K ratio above 1 means the patient should be losing fluid; 1 or less means too little natriuresis, so consider more diuretic.","ติดตามน้ำหนัก creatinine และโซเดียมในเลือด โดยเฉพาะช่วงสัปดาห์แรก อัตราส่วน Na/K ในปัสสาวะครั้งเดียวมากกว่า 1 แสดงว่าควรสูญเสียน้ำ ถ้า 1 หรือต่ำกว่าแสดงว่าขับโซเดียมน้อยไป ให้พิจารณาเพิ่มยา"],s:"aasld",h:"mon"},{t:["Adverse effects (20–40% of patients): AKI and hyponatremia and hypokalemia (mainly loops), hyperkalemia (mainly aldosterone antagonists), hepatic encephalopathy, muscle cramps. Painful gynecomastia from spironolactone: switch to amiloride or eplerenone (spironolactone 100 mg is about eplerenone 50 mg or amiloride 10 mg).","ผลข้างเคียง (พบ 20–40% ของผู้ป่วย): ไตวายเฉียบพลัน โซเดียมต่ำ โพแทสเซียมต่ำ (พบบ่อยกับยาลูป) โพแทสเซียมสูง (พบบ่อยกับยาต้านอัลโดสเตอโรน) สมองเสื่อมจากตับ ตะคริว เต้านมโตเจ็บจาก spironolactone ให้เปลี่ยนเป็น amiloride หรือ eplerenone (spironolactone 100 มก. เทียบเท่า eplerenone ราว 50 มก. หรือ amiloride ราว 10 มก.)"],s:"aasld",p:"Table 6",h:"safe"},{t:["Avoid NSAIDs, ACE inhibitors and ARBs; avoid aminoglycosides when possible.","หลีกเลี่ยง NSAIDs, ACE inhibitors และ ARBs และหลีกเลี่ยง aminoglycosides ถ้าเป็นไปได้"],s:"aasld",h:"stop"},{t:["Stop diuretics when AKI is diagnosed; diuretic withdrawal and albumin are part of the work-up before calling it HRS-AKI. In hypovolaemic hyponatremia stop diuretics; in hypervolaemic hyponatremia reduce or stop them.","หยุดยาขับปัสสาวะเมื่อวินิจฉัยไตวายเฉียบพลัน การหยุดยาและให้อัลบูมินเป็นส่วนหนึ่งก่อนวินิจฉัย HRS-AKI ในโซเดียมต่ำจากการขาดน้ำให้หยุดยา และในโซเดียมต่ำจากน้ำเกินให้ลดหรือหยุดยา"],s:"aasld",h:"stop"},{t:["Refractory ascites: diuretic-resistant (persists on maximal doses, typically furosemide 160 mg and spironolactone 400 mg) or diuretic-intractable (side effects stop maximal doses). Continuing diuretics in resistant ascites is ineffective and risks kidney injury.","ท้องมานดื้อต่อการรักษา: ดื้อยาขับปัสสาวะ (ยังมีท้องมานทั้งที่ได้ยาขนาดสูงสุด โดยทั่วไป furosemide 160 มก. และ spironolactone 400 มก.) หรือไม่สามารถทนยาได้ (ผลข้างเคียงทำให้ใช้ขนาดสูงสุดไม่ได้) การให้ยาขับปัสสาวะต่อในกลุ่มดื้อยาไม่ได้ผลและเสี่ยงไตเสื่อม"],s:"aasld",p:"p. 1020–1021",h:"ref"}]},{k:"htn",n:["Hypertension","ความดันโลหิตสูง"],color:"border-l-emerald-500",ids:["hctz","chlorthalidone","indapamide","spironolactone","eplerenone","amiloride","furosemide"],sh:["Hypertension","ความดันสูง"],qa:{first:["ACEi, ARB, DHP-CCB or thiazide / thiazide-like (chlorthalidone, indapamide) (ESC I A)","ACEi, ARB, DHP-CCB หรือไทอะไซด์ / ไทอะไซด์ไลค์ (chlorthalidone, indapamide) (ESC I A)"],add:["Three drugs, then spironolactone as the fourth (ESC IIa B, Thai I B)","ยา 3 ชนิด แล้วเพิ่ม spironolactone เป็นลำดับที่ 4 (ESC IIa B, ไทย I B)"],watch:["Potassium and kidney function closely in the first 8 weeks of spironolactone","โพแทสเซียมและการทำงานของไตอย่างใกล้ชิดใน 8 สัปดาห์แรกของ spironolactone"],avoid:["Spironolactone at eGFR below 30; caution at eGFR below 45 or K above 4.5","spironolactone เมื่อ eGFR ต่ำกว่า 30 และระวังเมื่อ eGFR ต่ำกว่า 45 หรือ K สูงกว่า 4.5"]},items:[{t:["Thiazide / thiazide-like diuretics prevent CV events about as well as the other major classes. Chlorthalidone and indapamide are more potent and longer-acting than hydrochlorothiazide, though more side effects have been reported for chlorthalidone in some studies.","ยาไทอะไซด์ / ไทอะไซด์ไลค์ป้องกันเหตุการณ์หัวใจและหลอดเลือดได้ใกล้เคียงกับยากลุ่มหลักอื่น chlorthalidone และ indapamide แรงกว่าและออกฤทธิ์นานกว่า hydrochlorothiazide แต่บางการศึกษารายงานผลข้างเคียงของ chlorthalidone มากกว่า"],s:"esh23",h:"over"},{t:["In CKD, a dihydropyridine CCB and/or a diuretic if needed to reach the blood-pressure target; a steroidal MRA for resistant hypertension if eGFR is 45 or more.","ในโรคไตเรื้อรังใช้ DHP-CCB และ/หรือยาขับปัสสาวะเมื่อจำเป็นเพื่อให้ถึงเป้าหมายความดัน และใช้ steroidal MRA สำหรับความดันสูงดื้อยาเมื่อ eGFR ตั้งแต่ 45"],s:"kdigo",p:"Fig. 18",h:"over"},{t:["High blood pressure with HFrEF: a thiazide diuretic is one of the safe options.","ความดันสูงร่วมกับ HFrEF: ยาไทอะไซด์เป็นตัวเลือกที่ปลอดภัยตัวหนึ่ง"],s:"thhf",p:"p. 37",h:"over"},{t:["ACE inhibitors, ARBs, dihydropyridine CCBs and thiazide / thiazide-like diuretics (chlorthalidone, indapamide) are the recommended first-line classes.","ACE inhibitors, ARBs, DHP-CCB และยาขับปัสสาวะกลุ่มไทอะไซด์ / ไทอะไซด์ไลค์ (chlorthalidone, indapamide) เป็นยากลุ่มแรกที่แนะนำ"],s:"esc24",c:"I A",also:[{s:"esh24"}],h:"first"},{t:["To prevent stroke: a RAS blocker plus a CCB or a thiazide-like diuretic.","เพื่อป้องกันโรคหลอดเลือดสมอง: RAS blocker ร่วมกับ CCB หรือยาไทอะไซด์ไลค์"],s:"esc24",c:"I A",h:"first"},{t:["If two drugs do not control BP, use three: usually a RAS blocker, a dihydropyridine CCB and a thiazide / thiazide-like diuretic, preferably in a single pill.","ถ้ายา 2 ชนิดคุมความดันไม่ได้ ให้ใช้ 3 ชนิด โดยทั่วไปคือ RAS blocker, DHP-CCB และยาไทอะไซด์ / ไทอะไซด์ไลค์ ควรเป็นยาเม็ดรวม"],s:"esc24",c:"I B",h:"titr"},{t:["Resistant hypertension needs at least three drugs: a RAS blocker, a CCB and a diuretic. If the patient has CKD with eGFR below 30–45, change the diuretic to a loop diuretic.","ความดันสูงดื้อยาต้องใช้ยาอย่างน้อย 3 ชนิด ได้แก่ RAS blocker, CCB และยาขับปัสสาวะ ถ้ามีโรคไตเรื้อรังที่ eGFR ต่ำกว่า 30–45 ให้เปลี่ยนยาขับปัสสาวะเป็นยากลุ่มลูป"],s:"thht",c:"IIa B",p:"p. 115",h:"titr"},{t:["If the diuretic is a thiazide, change it to a long-acting thiazide-like diuretic (chlorthalidone or indapamide).","ถ้ายาขับปัสสาวะที่ใช้เป็นไทอะไซด์ ให้เปลี่ยนเป็นไทอะไซด์ไลค์ออกฤทธิ์ยาว (chlorthalidone หรือ indapamide)"],s:"thht",c:"IIa B",p:"p. 115",h:"titr"},{t:["Fourth drug: an MRA, especially spironolactone (PATHWAY-2), 25–50 mg a day, with caution when eGFR is below 45 or potassium is high. Figure 6 allows spironolactone or eplerenone only at eGFR 30 or more.","ยาตัวที่ 4: MRA โดยเฉพาะ spironolactone (PATHWAY-2) ขนาด 25–50 มก./วัน ด้วยความระมัดระวังเมื่อ eGFR ต่ำกว่า 45 หรือโพแทสเซียมสูง ภาพที่ 6 ให้ใช้ spironolactone หรือ eplerenone เฉพาะเมื่อ eGFR ตั้งแต่ 30"],s:"thht",c:"I B",p:"p. 113, 115",h:"add"},{t:["Chlorthalidone for resistant hypertension at eGFR 15–30 if not yet used.","chlorthalidone สำหรับความดันสูงดื้อยาที่ eGFR 15–30 ถ้ายังไม่เคยใช้"],s:"thht",c:"IIa B",p:"p. 116",h:"add"},{t:["If spironolactone cannot be used: high-dose amiloride 10–20 mg works as well but is not sold in Thailand, so consider chlorthalidone instead, after stopping the previous diuretic.","ถ้าใช้ spironolactone ไม่ได้: amiloride ขนาดสูง 10–20 มก. ได้ผลใกล้เคียงกันแต่ไม่มีจำหน่ายในไทย จึงพิจารณา chlorthalidone แทน โดยหยุดยาขับปัสสาวะเดิมก่อน"],s:"thht",c:"IIa C",p:"p. 116",h:"add"},{t:["Resistant hypertension (ESC): add spironolactone to the existing treatment. Restrict it to eGFR 30 or more and potassium 4.5 mmol/L or less; steroidal MRAs are contraindicated at eGFR below 30. Check electrolytes and kidney function soon after the start and often afterwards.","ความดันสูงดื้อยา (ESC): เพิ่ม spironolactone ในยาเดิม ใช้เฉพาะเมื่อ eGFR ตั้งแต่ 30 และโพแทสเซียมไม่เกิน 4.5 มิลลิโมล/ลิตร ห้ามใช้ MRA ชนิดสเตียรอยด์เมื่อ eGFR ต่ำกว่า 30 ตรวจเกลือแร่และการทำงานของไตหลังเริ่มยาทันทีและบ่อยหลังจากนั้น"],s:"esc24",c:"IIa B",p:"Table 30, p. 3981",h:"add"},{t:["If spironolactone is not tolerated: eplerenone (50–200 mg a day, twice-daily dosing may be needed), or amiloride; other options are a beta-blocker, an alpha-blocker or a potassium-sparing diuretic. Patiromer helped CKD patients (eGFR 25–45) stay on spironolactone.","ถ้าทน spironolactone ไม่ได้: eplerenone (50–200 มก./วัน อาจต้องแบ่งให้วันละ 2 ครั้ง) หรือ amiloride ตัวเลือกอื่นคือ beta-blocker, alpha-blocker หรือยาขับปัสสาวะประหยัดโพแทสเซียม patiromer ช่วยให้ผู้ป่วย CKD (eGFR 25–45) ใช้ spironolactone ต่อได้"],s:"esc24",c:"IIa B",p:"p. 3980",h:"add"},{t:["Resistant hypertension, fourth line: spironolactone (PATHWAY-2). The 2018 advice to use it with caution at eGFR below 45 or potassium above 4.5 mmol/L reflected PATHWAY-2 exclusion criteria; safety beyond that is not established. Hyperkalaemia risk is higher in CKD, so check potassium and eGFR after starting and at least yearly, or every 3–6 months depending on risk. Patiromer or sodium zirconium cyclosilicate can lower the risk.","ความดันสูงดื้อยา ยาลำดับที่ 4: spironolactone (PATHWAY-2) คำแนะนำปี 2018 ให้ใช้ด้วยความระมัดระวังเมื่อ eGFR ต่ำกว่า 45 หรือโพแทสเซียมสูงกว่า 4.5 มิลลิโมล/ลิตร มาจากเกณฑ์คัดออกของ PATHWAY-2 ยังไม่ยืนยันความปลอดภัยนอกเหนือจากนั้น ความเสี่ยงโพแทสเซียมสูงมากขึ้นใน CKD จึงต้องตรวจโพแทสเซียมและ eGFR หลังเริ่มยา และอย่างน้อยปีละครั้งหรือทุก 3–6 เดือนตามความเสี่ยง patiromer หรือ sodium zirconium cyclosilicate ช่วยลดความเสี่ยง"],s:"esh23",p:"Section 12.4",h:"add"},{t:["If spironolactone is not tolerated: eplerenone (less potent), or high-dose amiloride 10–20 mg (as effective as spironolactone 25–50 mg in the PATHWAY-2 extension, but the marketed dose is 5 mg and it is not sold as a single agent in many places, so pill burden rises). If MRAs are not tolerated or contraindicated (eGFR below 30): bisoprolol 5–10 mg, doxazosin XL 4–8 mg or clonidine 0.1–0.3 mg twice a day.","ถ้าทน spironolactone ไม่ได้: eplerenone (แรงน้อยกว่า) หรือ amiloride ขนาดสูง 10–20 มก. (ได้ผลเทียบเท่า spironolactone 25–50 มก. ในช่วงต่อเนื่องของ PATHWAY-2 แต่ขนาดที่จำหน่ายคือ 5 มก. และหลายประเทศไม่มียาเดี่ยว ทำให้ต้องกินยาหลายเม็ด) ถ้าใช้ MRA ไม่ได้หรือห้ามใช้ (eGFR ต่ำกว่า 30): bisoprolol 5–10 มก. doxazosin XL 4–8 มก. หรือ clonidine 0.1–0.3 มก. วันละ 2 ครั้ง"],s:"esh23",p:"Section 12.4",h:"add"},{t:["Chlorthalidone lowers BP more than hydrochlorothiazide; 12.5–50 mg a day helped patients with CKD whose BP was not controlled on 3–4 drugs.","chlorthalidone ลดความดันได้ดีกว่า hydrochlorothiazide และขนาด 12.5–50 มก./วัน ช่วยผู้ป่วยโรคไตเรื้อรังที่คุมความดันไม่ได้แม้ใช้ยา 3–4 ชนิด"],s:"thht",p:"p. 116",h:"trial"},{t:["DCP trial (US Veterans over 65 already on hydrochlorothiazide, switched to chlorthalidone 12.5 or 25 mg for HCTZ 25 or 50 mg): no difference in CV outcomes, except more benefit with chlorthalidone after a prior stroke.","การศึกษา DCP (ทหารผ่านศึกสหรัฐฯ อายุเกิน 65 ปีที่ใช้ hydrochlorothiazide อยู่ สลับเป็น chlorthalidone 12.5 หรือ 25 มก. แทน HCTZ 25 หรือ 50 มก.): ผลลัพธ์หัวใจและหลอดเลือดไม่ต่างกัน ยกเว้นผู้ที่เคยเป็นโรคหลอดเลือดสมองได้ประโยชน์จาก chlorthalidone มากกว่า"],s:"esh23",h:"trial"},{t:["After starting spironolactone check kidney function and potassium closely in the first 8 weeks.","หลังเริ่ม spironolactone ตรวจการทำงานของไตและโพแทสเซียมอย่างใกล้ชิดใน 8 สัปดาห์แรก"],s:"thht",p:"p. 116",h:"mon"}]},{k:"ckd",n:["Chronic kidney disease","โรคไตเรื้อรัง"],color:"border-l-teal-500",ids:["furosemide","chlorthalidone","spironolactone","eplerenone"],sh:["CKD","CKD"],qa:{first:["No loop-diuretic dosing in this guideline; a diuretic and/or DHP-CCB to reach the BP target","แนวทางนี้ไม่มีขนาดยาลูป ใช้ยาขับปัสสาวะและ/หรือ DHP-CCB เพื่อให้ถึงเป้าหมายความดัน"],add:["Steroidal MRA for resistant hypertension if eGFR is 45 or more","steroidal MRA สำหรับความดันสูงดื้อยาเมื่อ eGFR ตั้งแต่ 45"],watch:["Creatinine and potassium 2–4 weeks after starting an ACEi or ARB","creatinine และโพแทสเซียมภายใน 2–4 สัปดาห์หลังเริ่ม ACEi หรือ ARB"],avoid:["Diuretics during a dehydrating illness, before elective surgery, and around contrast in AKI or eGFR below 30","ยาขับปัสสาวะเมื่อป่วยจนขาดน้ำ ก่อนผ่าตัดแบบนัดหมาย และรอบการฉีดสารทึบรังสีเมื่อมีไตวายเฉียบพลันหรือ eGFR ต่ำกว่า 30"]},items:[{t:["The guideline text has no loop-diuretic dosing for oedema (checked by searching its text). Its diuretic statements are about blood pressure, potassium and safety, listed here.","ข้อความในแนวทางไม่มีขนาดยาลูปสำหรับภาวะบวม (ตรวจด้วยการค้นข้อความ) ข้อความเกี่ยวกับยาขับปัสสาวะเกี่ยวกับความดัน โพแทสเซียม และความปลอดภัย ดังรายการนี้"],s:"kdigo",h:"over"},{t:["Blood pressure: a dihydropyridine CCB and/or a diuretic if needed to reach the individual target; ACEi or ARB first when albuminuria is present.","ความดันโลหิต: DHP-CCB และ/หรือยาขับปัสสาวะเมื่อจำเป็นเพื่อให้ถึงเป้าหมายรายบุคคล และ ACEi หรือ ARB ก่อนเมื่อมีอัลบูมินในปัสสาวะ"],s:"kdigo",p:"Fig. 18",h:"first"},{t:["After starting an ACEi or ARB, check creatinine and potassium within 2–4 weeks. If eGFR falls by 30% or more, review diuretics and NSAIDs.","หลังเริ่ม ACEi หรือ ARB ตรวจ creatinine และโพแทสเซียมภายใน 2–4 สัปดาห์ ถ้า eGFR ลดลง 30% ขึ้นไปให้ทบทวนยาขับปัสสาวะและ NSAIDs"],s:"kdigo",p:"Fig. 21",h:"mon"},{t:["Hyperkalemia (potassium above 5.5 mmol/L): consider appropriate use of diuretics, alongside bicarbonate and potassium binders.","โพแทสเซียมสูง (มากกว่า 5.5 มิลลิโมล/ลิตร): พิจารณาใช้ยาขับปัสสาวะอย่างเหมาะสม ร่วมกับโซเดียมไบคาร์บอเนตและยาจับโพแทสเซียม"],s:"kdigo",p:"Fig. 32",h:"safe"},{t:["Observational data: thiazide and loop diuretics raise serum uric acid.","ข้อมูลเชิงสังเกต: ยาไทอะไซด์และยาลูปทำให้กรดยูริกในเลือดสูงขึ้น"],s:"kdigo",h:"safe"},{t:["Sick-day rules usually say to pause diuretics in a dehydrating illness, with a clear plan to restart; the evidence for this is thin. Consider pausing diuretics before elective surgery (volume depletion, AKI).","กฎวันป่วยมักให้หยุดยาขับปัสสาวะชั่วคราวเมื่อป่วยจนขาดน้ำ พร้อมแผนเริ่มยาใหม่ที่ชัดเจน แต่หลักฐานยังน้อย พิจารณาหยุดยาขับปัสสาวะชั่วคราวก่อนผ่าตัดแบบนัดหมาย (ขาดน้ำ ไตวายเฉียบพลัน)"],s:"kdigo",p:"Practice Point 4.3.2, Table 32",h:"stop"},{t:["Before radiocontrast in AKI or eGFR below 30, withdraw non-essential nephrotoxic drugs including diuretics for 24–48 hours before and 48 hours after.","ก่อนฉีดสารทึบรังสีในผู้ที่มีไตวายเฉียบพลันหรือ eGFR ต่ำกว่า 30 ให้งดยาที่ไม่จำเป็นและเป็นพิษต่อไต รวมถึงยาขับปัสสาวะ 24–48 ชั่วโมงก่อน และ 48 ชั่วโมงหลังฉีด"],s:"kdigo",h:"stop"}]},{k:"nephrotic",n:["Nephrotic oedema","ภาวะบวมจากไตเนโฟรติก"],color:"border-l-cyan-500",ids:["furosemide","torsemide","bumetanide","hctz","metolazone","chlorthalidone","amiloride","spironolactone","acetazolamide"],sh:["Nephrotic","เนโฟรติก"],qa:{first:["Loop diuretic, usually twice a day and at higher doses; sodium 1.5–2 g a day","ยาลูป มักวันละ 2 ครั้ง ขนาดสูงขึ้น และโซเดียม 1.5–2 กรัม/วัน"],add:["Thiazide-like 2–5 h before the loop; amiloride; IV loop; albumin if albumin is below 2.0 g/dL","ไทอะไซด์ไลค์ก่อนยาลูป 2–5 ชม. amiloride ยาลูปฉีด และอัลบูมินเมื่อต่ำกว่า 2.0 ก./ดล."],watch:["N/A: no monitoring schedule in this section","N/A: ส่วนนี้ไม่มีตารางติดตาม"],avoid:["A rapid IV push of loop diuretics (hearing loss, tinnitus)","การฉีดยาลูปเข้าหลอดเลือดดำอย่างเร็ว (หูหนวก หูอื้อ)"]},items:[{t:["Mainstay: diuretics with moderate sodium restriction (1.5–2 g or 60–90 mmol a day). Nephrotic patients are often diuretic-resistant, even with a normal GFR.","หลักของการรักษา: ยาขับปัสสาวะร่วมกับจำกัดโซเดียมปานกลาง (1.5–2 กรัม หรือ 60–90 mmol/วัน) ผู้ป่วยเนโฟรติกมักดื้อต่อยาขับปัสสาวะแม้ GFR ปกติ"],s:"kdigogd",p:"p. S95",h:"over"},{t:["Loop diuretics are first-line, usually twice a day. Higher doses are needed (less drug reaches the loop of Henle). Torsemide and bumetanide may have more consistent absorption than furosemide (from heart-failure studies).","ยากลุ่มลูปเป็นยาแรก มักให้วันละ 2 ครั้ง ต้องใช้ขนาดสูงขึ้น (ยาไปถึงห่วงเฮนเลได้น้อยลง) torsemide และ bumetanide อาจดูดซึมสม่ำเสมอกว่า furosemide (จากการศึกษาในหัวใจล้มเหลว)"],s:"kdigogd",p:"p. S95",h:"first"},{t:["If maximal oral loop therapy fails, switch to IV loop diuretic, bolus or infusion. Do not give a rapid IV push (hearing loss, tinnitus); an infusion may lessen toxicity.","ถ้ายาลูปชนิดกินขนาดสูงสุดไม่ได้ผล ให้เปลี่ยนเป็นยาลูปชนิดฉีดแบบครั้งหรือหยดต่อเนื่อง ไม่ฉีดเร็ว (หูหนวก หูอื้อ) การหยดต่อเนื่องอาจลดความเป็นพิษ"],s:"kdigogd",p:"p. S95",h:"titr"},{t:["Add a thiazide-like diuretic (hydrochlorothiazide, metolazone or chlorthalidone) to a loop diuretic to overcome resistance; give the thiazide 2–5 hours before a loop infusion.","เพิ่มยากลุ่มไทอะไซด์ไลค์ (hydrochlorothiazide, metolazone หรือ chlorthalidone) ร่วมกับยาลูปเพื่อแก้ภาวะดื้อยา และให้ไทอะไซด์ก่อนหยดยาลูป 2–5 ชั่วโมง"],s:"kdigogd",p:"p. S95",h:"add"},{t:["Amiloride may help as an add-on for oedema, hypertension and hypokalaemia (not validated in RCTs). Acetazolamide is a weaker diuretic but may help if there is severe metabolic alkalosis.","amiloride อาจช่วยเสริมสำหรับอาการบวม ความดันสูง และโพแทสเซียมต่ำ (ยังไม่มี RCT ยืนยัน) acetazolamide ขับปัสสาวะอ่อนกว่า แต่อาจช่วยเมื่อมีภาวะด่างเมตาบอลิกรุนแรง"],s:"kdigogd",p:"p. S95",h:"add"},{t:["For diuretic-resistant patients with serum albumin below 2.0 g/dL, IV albumin (25–50 g given 30–60 minutes before the loop diuretic, or premixed) can be considered; the effect is transient and the evidence in adults is thin.","ผู้ป่วยดื้อยาขับปัสสาวะที่อัลบูมินต่ำกว่า 2.0 ก./ดล. พิจารณาให้อัลบูมินทางหลอดเลือดดำ (25–50 กรัม ก่อนยาลูป 30–60 นาที หรือผสมกับยา) ผลเกิดชั่วคราวและหลักฐานในผู้ใหญ่ยังน้อย"],s:"kdigogd",p:"p. S96",h:"add"},{t:["Potassium-sparing diuretics (spironolactone, amiloride) help keep potassium normal and can add to the natriuresis. Water restriction is usually not needed unless hyponatremia develops. Ultrafiltration or dialysis is occasionally needed, especially with AKI.","ยาขับปัสสาวะประหยัดโพแทสเซียม (spironolactone, amiloride) ช่วยรักษาระดับโพแทสเซียมและเสริมการขับโซเดียม โดยทั่วไปไม่ต้องจำกัดน้ำเว้นแต่มีโซเดียมต่ำ บางรายต้องทำ ultrafiltration หรือฟอกเลือด โดยเฉพาะเมื่อมีไตวายเฉียบพลัน"],s:"kdigogd",p:"p. S96",h:"add"}]},{k:"hypona",n:["Hyponatremia","โซเดียมในเลือดต่ำ"],color:"border-l-sky-500",ids:["tolvaptan","furosemide","hctz","spironolactone"],sh:["Hyponatremia","โซเดียมต่ำ"],qa:{first:["Treat by volume status: reduced volume: saline; expanded: fluid restriction; SIAD: fluid restriction first","รักษาตามปริมาตรน้ำ: ขาดน้ำให้ saline น้ำเกินจำกัดน้ำ SIAD จำกัดน้ำก่อน"],add:["SIAD second line: urea or low-dose loop plus oral salt","SIAD ลำดับสอง: urea หรือยาลูปขนาดต่ำร่วมกับเกลือชนิดกิน"],watch:["Sodium rise no more than 10 mmol/L in 24 h and 8 mmol/L in each 24 h after","โซเดียมเพิ่มไม่เกิน 10 mmol/L ใน 24 ชม. และไม่เกิน 8 mmol/L ในทุก 24 ชม.ถัดไป"],avoid:["Overcorrection: demyelination has followed correction of severe thiazide-induced hyponatremia","แก้โซเดียมเร็วเกิน: มีรายงาน demyelination หลังแก้โซเดียมต่ำรุนแรงจากไทอะไซด์"]},items:[{t:["Diuretics, and especially thiazides, are frequently implicated in hyponatraemia; loop diuretics are less likely to cause it. A recent thiazide prescription is listed among causes of acute hyponatraemia.","ยาขับปัสสาวะ โดยเฉพาะไทอะไซด์ เป็นสาเหตุที่พบบ่อยของโซเดียมต่ำ ยากลุ่มลูปทำให้เกิดน้อยกว่า และการเพิ่งได้รับไทอะไซด์ถูกจัดเป็นสาเหตุของโซเดียมต่ำแบบเฉียบพลัน"],s:"eje14",p:"G14, G17, G18",h:"over"},{t:["If urine sodium is above 30 mmol/L, assess extracellular fluid status and diuretic use to tell the causes apart. In patients on diuretics, urine sodium must be read with caution.","ถ้าโซเดียมในปัสสาวะมากกว่า 30 mmol/L ให้ประเมิน extracellular fluid และการใช้ยาขับปัสสาวะเพื่อแยกสาเหตุ และควรแปลผลโซเดียมในปัสสาวะด้วยความระมัดระวังในผู้ที่ใช้ยาขับปัสสาวะ"],s:"eje14",c:"2D",p:"G22, G25",h:"over"},{t:["Thiazides are the main cause of diuretic-induced hyponatremia: in a literature review 73% of cases were thiazides alone, 20% thiazides with an anti-kaliuretic agent and 8% furosemide. Typical patients are elderly women, and a previous episode raises the risk of recurrence.","ไทอะไซด์เป็นสาเหตุหลักของโซเดียมต่ำจากยาขับปัสสาวะ จากการทบทวนวรรณกรรม 73% เกิดจากไทอะไซด์อย่างเดียว 20% จากไทอะไซด์ร่วมกับยาประหยัดโพแทสเซียม และ 8% จาก furosemide ผู้ป่วยทั่วไปเป็นหญิงสูงอายุ และเคยเป็นมาก่อนเพิ่มโอกาสกลับเป็นซ้ำ"],s:"verb13",p:"PDF p. 12",h:"over"},{t:["Expanded extracellular fluid (heart failure, cirrhosis): fluid restriction (2D); vasopressin receptor antagonists are recommended against (1C).","extracellular fluid มากเกิน (หัวใจล้มเหลว ตับแข็ง): จำกัดน้ำ (2D) และแนะนำไม่ใช้ vasopressin receptor antagonists (1C)"],s:"eje14",c:"2D / 1C",p:"G34",h:"tx"},{t:["SIAD: fluid restriction first. Equal second-line options: urea 0.25–0.50 g/kg a day, or low-dose loop diuretic plus oral sodium chloride. Vasopressin receptor antagonists are not recommended in moderate and recommended against in profound hyponatraemia.","SIAD: จำกัดน้ำก่อน ตัวเลือกลำดับสองเท่ากัน คือ urea 0.25–0.50 ก./กก./วัน หรือยาลูปขนาดต่ำร่วมกับโซเดียมคลอไรด์ชนิดกิน ไม่แนะนำ vasopressin receptor antagonists ในโซเดียมต่ำระดับปานกลาง และแนะนำไม่ใช้ในระดับรุนแรง"],s:"eje14",c:"2D / 1C",p:"G34",h:"tx"},{t:["Reduced circulating volume: restore volume with 0.9% saline or a balanced crystalloid at 0.5–1.0 mL/kg per hour.","ปริมาตรหมุนเวียนลดลง: ให้สารน้ำ 0.9% saline หรือ balanced crystalloid 0.5–1.0 mL/กก./ชม. เพื่อชดเชยปริมาตร"],s:"eje14",c:"1B",p:"G34",h:"tx"},{t:["Tolvaptan (oral V2 antagonist) and conivaptan (IV: 20 mg load over 30 minutes, then 20–40 mg a day) are FDA-approved for euvolaemic and hypervolaemic hyponatremia. Aquaretics remove water without the neurohormonal activation of loop diuretics: only one third of the water lost comes from extracellular fluid, two thirds from intracellular water.","tolvaptan (ยากิน ต้านตัวรับ V2) และ conivaptan (ฉีด: 20 มก. ใน 30 นาที ตามด้วย 20–40 มก./วัน) ได้รับอนุมัติจาก FDA สำหรับโซเดียมต่ำชนิด euvolaemic และ hypervolaemic ยากลุ่ม aquaretic ขับน้ำโดยไม่กระตุ้น neurohormonal เหมือนยาลูป น้ำที่สูญเสียมาจาก extracellular fluid เพียงหนึ่งในสาม และอีกสองในสามมาจากน้ำในเซลล์"],s:"verb13",p:"PDF p. 22–23",h:"tx"},{t:["Heart failure with volume overload and/or hyponatremia: tolvaptan may be considered (the Thai heart-failure guideline; the European hyponatraemia guideline above advises against vaptans when extracellular fluid is expanded).","หัวใจล้มเหลวที่มีภาวะน้ำเกินและ/หรือโซเดียมต่ำ: พิจารณาใช้ tolvaptan (แนวทางหัวใจล้มเหลวของไทย ส่วนแนวทางโซเดียมต่ำของยุโรปข้างต้นแนะนำไม่ใช้ vaptans เมื่อ extracellular fluid มากเกิน)"],s:"thhf",c:"IIa B",h:"tx"},{t:["Cirrhosis, hypovolaemic hyponatremia: stop diuretics (and laxatives) and give fluid: 5% albumin or a crystalloid (lactated Ringer’s preferred).","ตับแข็งที่โซเดียมต่ำจากการขาดน้ำ: หยุดยาขับปัสสาวะ (และยาระบาย) และให้สารน้ำ เป็นอัลบูมิน 5% หรือ crystalloid (แนะนำ lactated Ringer’s)"],s:"aasld",p:"p. 1025",h:"tx"},{t:["Cirrhosis, hypervolaemic hyponatremia: fluid restriction, reduce or stop diuretics and laxatives, hyperoncotic albumin and/or vaptans. Correct chronic hyponatremia slowly to avoid osmotic demyelination.","ตับแข็งที่โซเดียมต่ำจากน้ำเกิน: จำกัดน้ำ ลดหรือหยุดยาขับปัสสาวะและยาระบาย ให้อัลบูมินความเข้มข้นสูง และ/หรือ vaptans แก้โซเดียมต่ำเรื้อรังอย่างช้าๆ เพื่อเลี่ยง osmotic demyelination"],s:"aasld",p:"p. 1025",h:"tx"},{t:["Raise sodium by no more than 10 mmol/L in the first 24 hours and no more than 8 mmol/L in each 24 hours after; the osmotic demyelination risk is higher with thiazide use among other factors.","ไม่ให้โซเดียมเพิ่มเกิน 10 mmol/L ใน 24 ชั่วโมงแรก และไม่เกิน 8 mmol/L ในทุก 24 ชั่วโมงถัดไป การใช้ไทอะไซด์เป็นปัจจัยหนึ่งที่เพิ่มความเสี่ยง osmotic demyelination"],s:"eje14",c:"1D",p:"G33",h:"safe"},{t:["Stopping a thiazide and correcting volume depletion can be followed by a rapid water diuresis that raises sodium very quickly; osmotic demyelination has been reported after correction of severe thiazide-induced hyponatremia.","การหยุดไทอะไซด์และแก้ภาวะขาดน้ำอาจตามด้วยการขับน้ำปริมาณมากอย่างรวดเร็วทำให้โซเดียมสูงขึ้นเร็วมาก มีรายงาน osmotic demyelination หลังแก้โซเดียมต่ำรุนแรงที่เกิดจากไทอะไซด์"],s:"verb13",p:"PDF p. 25",h:"safe"},{t:["Tolvaptan and the liver: in the TEMPO trial (ADPKD, doses up to 120 mg a day versus a 60 mg maximum for hyponatremia) ALT above 3 times normal occurred in 4.4% vs 1.0%, and the FDA warned of possible irreversible, fatal liver injury. No liver damage was reported at approved doses in the hyponatremia trials, including the long-term SALTWATER and EVEREST.","tolvaptan กับตับ: ในการศึกษา TEMPO (ADPKD ขนาดสูงสุด 120 มก./วัน เทียบกับขนาดสูงสุด 60 มก./วันสำหรับโซเดียมต่ำ) ALT เกิน 3 เท่าของค่าปกติพบ 4.4% เทียบ 1.0% และ FDA เตือนว่าอาจเกิดตับบาดเจ็บถาวรและถึงชีวิต ในการศึกษาโซเดียมต่ำที่ใช้ขนาดที่อนุมัติไม่พบตับเสียหาย รวมถึง SALTWATER และ EVEREST ที่ใช้ระยะยาว"],s:"verb13",p:"PDF p. 23",h:"safe"}]},{k:"angle",n:["Acute angle-closure glaucoma","ต้อหินมุมปิดเฉียบพลัน"],color:"border-l-violet-500",ids:["acetazolamide","mannitol"],sh:["Angle-closure","มุมปิด"],qa:{first:["Acetazolamide at once if IOP is 40 mmHg or more (IV 10 mg/kg if vomiting)","acetazolamide ทันทีเมื่อความดันตา 40 mmHg ขึ้นไป (ฉีด 10 มก./กก. ถ้าอาเจียน)"],add:["IV mannitol 0.5–1.5 g/kg if the response is inadequate","mannitol ทางหลอดเลือดดำ 0.5–1.5 ก./กก. เมื่อตอบสนองไม่เพียงพอ"],watch:["Check for heart or kidney disease before mannitol","ประเมินโรคหัวใจและไตก่อนให้ mannitol"],avoid:["Acetazolamide with sulphonamide allergy or severe kidney disease; repeated mannitol","acetazolamide เมื่อแพ้ซัลฟาหรือโรคไตรุนแรง และการให้ mannitol ซ้ำ"]},items:[{t:["Immediate acetazolamide is recommended if IOP is 40 mmHg or more; give it IV (10 mg/kg) if the patient is vomiting or a rapid effect is needed. It reduces aqueous production.","ให้ acetazolamide ทันทีเมื่อความดันตา 40 mmHg ขึ้นไป ให้ทางหลอดเลือดดำ (10 มก./กก.) ถ้าผู้ป่วยอาเจียนหรือต้องการผลเร็ว ยานี้ลดการสร้างน้ำในลูกตา"],s:"egs6",p:"p. 147",h:"first"},{t:["IV mannitol 0.5–1.5 g/kg as a 15% or 20% solution at 3–5 mL/minute can be considered if the response to acetazolamide is inadequate. Check for heart or kidney disease first; risks include dehydration, fluid overload, pulmonary oedema, electrolyte imbalance and AKI. Repeated use is not advisable.","พิจารณา mannitol ทางหลอดเลือดดำ 0.5–1.5 ก./กก. ความเข้มข้น 15% หรือ 20% อัตรา 3–5 mL/นาที เมื่อตอบสนองต่อ acetazolamide ไม่เพียงพอ ต้องประเมินโรคหัวใจและไตก่อน ความเสี่ยงได้แก่ ขาดน้ำ น้ำเกิน ปอดบวมน้ำ เกลือแร่ผิดปกติ และไตวายเฉียบพลัน ไม่ควรให้ซ้ำหลายครั้ง"],s:"egs6",p:"p. 147",h:"add"},{t:["Acetazolamide, IV mannitol or oral hyperosmotics may be needed to clear the cornea before laser iridotomy.","อาจต้องใช้ acetazolamide, mannitol ทางหลอดเลือดดำ หรือยาออสโมติกชนิดกิน เพื่อให้กระจกตาใสก่อนทำ laser iridotomy"],s:"egs6",p:"p. 187",h:"add"},{t:["Avoid acetazolamide with a history of sulphonamide allergy or severe kidney disease. Serious side effects include hypokalaemia, metabolic acidosis and dyspnoea; Stevens-Johnson syndrome is extremely rare.","หลีกเลี่ยง acetazolamide เมื่อมีประวัติแพ้ซัลฟาหรือโรคไตรุนแรง ผลข้างเคียงสำคัญ ได้แก่ โพแทสเซียมต่ำ กรดเมตาบอลิก และหายใจลำบาก ส่วน Stevens-Johnson พบได้น้อยมาก"],s:"egs6",p:"p. 147",h:"safe"}]},{k:"poag",n:["Open-angle glaucoma (oral carbonic anhydrase inhibitors)","ต้อหินมุมเปิด (ยายับยั้ง carbonic anhydrase ชนิดกิน)"],color:"border-l-purple-500",ids:["acetazolamide"],sh:["Open-angle","มุมเปิด"],qa:{first:["Oral acetazolamide or methazolamide lowers IOP about 20–30%; not first-line","acetazolamide หรือ methazolamide ชนิดกินลดความดันตาราว 20–30% ไม่ใช่ยาขนานแรก"],add:["Hyperosmotic agents (glycerol, mannitol) dehydrate the vitreous","ยา hyperosmotic (glycerol, mannitol) ทำให้วุ้นตาขาดน้ำ"],watch:["N/A: no monitoring advice in the medication table","N/A: ตารางยาไม่มีคำแนะนำการติดตาม"],avoid:["Sulfonamide allergy, kidney stones, aplastic anaemia, thrombocytopenia, sickle cell disease","แพ้ซัลโฟนาไมด์ นิ่วในไต aplastic anaemia เกล็ดเลือดต่ำ โรคเม็ดเลือดแดงรูปเคียว"]},items:[{t:["Oral carbonic anhydrase inhibitors (acetazolamide, methazolamide) lower IOP by about 20–30% by decreasing aqueous production. They sit with the other glaucoma medications, not as first-line.","ยายับยั้ง carbonic anhydrase ชนิดกิน (acetazolamide, methazolamide) ลดความดันตาได้ราว 20–30% โดยลดการสร้างน้ำในลูกตา เป็นยาในกลุ่มยาต้อหินอื่นและไม่ใช่ยาขนานแรก"],s:"aao20",p:"PDF p. 29",h:"over"},{t:["Hyperosmotic agents (glycerol, mannitol) dehydrate the vitreous; cautions: heart failure, renal failure, diabetic complications, confusion.","ยา hyperosmotic (glycerol, mannitol) ทำให้วุ้นตาขาดน้ำ ข้อควรระวัง: หัวใจล้มเหลว ไตวาย ภาวะแทรกซ้อนของเบาหวาน สับสน"],s:"aao20",p:"PDF p. 29",h:"add"},{t:["Possible side effects: Stevens-Johnson syndrome, malaise, anorexia, depression, electrolyte imbalance, renal calculi, blood dyscrasias (aplastic anaemia, thrombocytopenia), metallic taste, enuresis, paraesthesia, diarrhoea, abdominal cramps.","ผลข้างเคียงที่อาจเกิด: Stevens-Johnson syndrome อ่อนเพลีย เบื่ออาหาร ซึมเศร้า เกลือแร่ผิดปกติ นิ่วในไต เม็ดเลือดผิดปกติ (aplastic anaemia, เกล็ดเลือดต่ำ) รสโลหะ ปัสสาวะราด ชาปลายมือเท้า ท้องเสีย ปวดเกร็งท้อง"],s:"aao20",p:"PDF p. 29",h:"safe"},{t:["Contraindications: sulfonamide allergy, kidney stones, aplastic anaemia, thrombocytopenia, sickle cell disease. FDA pregnancy category C; high doses were teratogenic in animals.","ข้อห้าม: แพ้ซัลโฟนาไมด์ นิ่วในไต aplastic anaemia เกล็ดเลือดต่ำ และโรคเม็ดเลือดแดงรูปเคียว FDA pregnancy category C และขนาดสูงทำให้เกิดความพิการในสัตว์ทดลอง"],s:"aao20",p:"PDF p. 29, 31",h:"safe"}]},{k:"altitude",n:["Altitude illness","โรคแพ้ที่สูง"],color:"border-l-lime-500",ids:["acetazolamide"],sh:["Altitude","ที่สูง"],qa:{first:["Acetazolamide 125 mg every 12 h to prevent AMS at moderate or high risk","acetazolamide 125 มก. ทุก 12 ชม. เพื่อป้องกัน AMS เมื่อเสี่ยงปานกลางถึงสูง"],add:["Dexamethasone as the adult alternative; acetazolamide 250 mg every 12 h to treat AMS","dexamethasone เป็นทางเลือกในผู้ใหญ่ และ acetazolamide 250 มก. ทุก 12 ชม. เพื่อรักษา AMS"],watch:["Paraesthesia is common; altitude illness can trigger ketoacidosis in diabetes","ชาปลายมือเท้าพบบ่อย และโรคแพ้ที่สูงอาจกระตุ้น ketoacidosis ในเบาหวาน"],avoid:["Diuretics and acetazolamide for treating HAPE","ยาขับปัสสาวะและ acetazolamide เพื่อรักษา HAPE"]},items:[{t:["Acetazolamide should be strongly considered for travellers at moderate or high risk of acute mountain sickness (AMS). Dexamethasone is the alternative in adults.","ควรพิจารณา acetazolamide อย่างจริงจังในผู้เดินทางที่เสี่ยงปานกลางถึงสูงต่อโรคแพ้ที่สูงเฉียบพลัน (AMS) ผู้ใหญ่ใช้ dexamethasone แทนได้"],s:"wms24",c:"strong, high",h:"first"},{t:["Prevention (AMS and HACE): acetazolamide 125 mg every 12 h for low-to-moderate-risk ascent profiles; consider 250 mg twice a day for high-risk profiles. Children: 1.25 mg/kg every 12 h (maximum 125 mg a dose).","ป้องกัน (AMS และ HACE): acetazolamide 125 มก. ทุก 12 ชั่วโมงสำหรับการขึ้นที่สูงที่เสี่ยงต่ำถึงปานกลาง ถ้าเสี่ยงสูงพิจารณา 250 มก. วันละ 2 ครั้ง เด็ก: 1.25 มก./กก. ทุก 12 ชั่วโมง (สูงสุด 125 มก./ครั้ง)"],s:"wms24",p:"Table 1",h:"dose"},{t:["Start the night before ascent; day-of-ascent dosing still helps. Continue 2 days after arrival if you ascend at the recommended rate, 2–4 days if faster. If you go up and straight back down, stop once descent starts.","เริ่มก่อนขึ้นที่สูงหนึ่งคืน ถ้าเริ่มวันที่ขึ้นก็ยังได้ประโยชน์ ให้ต่อ 2 วันหลังถึงถ้าขึ้นตามอัตราที่แนะนำ และ 2–4 วันถ้าขึ้นเร็วกว่านั้น ถ้าขึ้นแล้วลงทันทีให้หยุดเมื่อเริ่มลง"],s:"wms24",p:"Table 1",h:"dose"},{t:["Treating AMS: acetazolamide 250 mg every 12 h (children 2.5 mg/kg every 12 h, maximum 250 mg a dose) can be considered.","รักษา AMS: พิจารณา acetazolamide 250 มก. ทุก 12 ชั่วโมง (เด็ก 2.5 มก./กก. ทุก 12 ชั่วโมง สูงสุด 250 มก./ครั้ง)"],s:"wms24",c:"strong, low",p:"Table 1",h:"dose"},{t:["Prevention (adults): acetazolamide 125 mg twice a day, 250 mg twice a day if over 100 kg. Start the day before ascent and continue for the first two days at altitude, longer if the ascent continues.","ป้องกัน (ผู้ใหญ่): acetazolamide 125 มก. วันละ 2 ครั้ง หรือ 250 มก. วันละ 2 ครั้งถ้าน้ำหนักเกิน 100 กก. เริ่มก่อนขึ้นที่สูงหนึ่งวันและให้ต่อ 2 วันแรกที่ระดับความสูงนั้น นานกว่านั้นถ้ายังขึ้นต่อ"],s:"cdc",h:"dose"},{t:["Treating acute mountain sickness (adults): 250 mg twice a day; the only studied treatment dose is 250 mg twice, 8 hours apart. For children: 2.5 mg/kg every 12 hours, up to 250 mg.","รักษาโรคแพ้ที่สูงเฉียบพลัน (ผู้ใหญ่): 250 มก. วันละ 2 ครั้ง ขนาดรักษาที่เคยศึกษามีเพียง 250 มก. 2 ครั้ง ห่างกัน 8 ชั่วโมง เด็ก: 2.5 มก./กก. ทุก 12 ชั่วโมง สูงสุด 250 มก."],s:"cdc",h:"dose"},{t:["Children, prevention: 1.25 mg/kg every 12 hours up to 125 mg (table), or 2.5–5 mg/kg a day divided up to 125 mg twice a day (text); the page states the two slightly differently.","เด็ก ป้องกัน: 1.25 มก./กก. ทุก 12 ชั่วโมง สูงสุด 125 มก. (ตาราง) หรือ 2.5–5 มก./กก./วัน แบ่งให้ สูงสุด 125 มก. วันละ 2 ครั้ง (ข้อความ) ซึ่งหน้าเว็บระบุไว้ต่างกันเล็กน้อย"],s:"cdc",h:"dose"},{t:["People allergic to sulfa antibiotics can take acetazolamide (cross-sensitivity has not been reported), but a history of anaphylaxis to any drug or multiple drug allergies needs caution. Paresthesia is common; the 125 mg dose helps limit it.","ผู้ที่แพ้ยาปฏิชีวนะกลุ่มซัลฟาใช้ acetazolamide ได้ (ยังไม่มีรายงานการแพ้ข้ามกลุ่ม) แต่ประวัติ anaphylaxis ต่อยาใดๆ หรือแพ้ยาหลายชนิดต้องระวัง อาการชาปลายมือเท้าพบบ่อย ขนาด 125 มก. ช่วยลดอาการนี้"],s:"cdc",h:"safe"},{t:["Altitude illness can trigger diabetic ketoacidosis, which may be harder to treat in people taking acetazolamide. HACE treatment is oxygen, dexamethasone and descent; the page lists acetazolamide for HACE prevention only, and does not list it for HAPE.","โรคแพ้ที่สูงอาจกระตุ้นภาวะ ketoacidosis ในเบาหวาน ซึ่งรักษายากขึ้นในผู้ที่ใช้ acetazolamide การรักษา HACE คือออกซิเจน dexamethasone และลงจากที่สูง หน้าเว็บระบุ acetazolamide สำหรับป้องกัน HACE เท่านั้น และไม่ได้ระบุสำหรับ HAPE"],s:"cdc",h:"safe"},{t:["HAPE: acetazolamide is not recommended for prevention in people with HAPE on prior trips, but may be considered to prevent re-entry HAPE. Diuretics and acetazolamide are both recommended against for treating HAPE (diuretic effect may cause hypotension in volume-depleted patients).","HAPE: ไม่แนะนำ acetazolamide เพื่อป้องกันในผู้ที่เคยเป็น HAPE จากการเดินทางครั้งก่อน แต่พิจารณาได้เพื่อป้องกัน re-entry HAPE ไม่แนะนำยาขับปัสสาวะและ acetazolamide สำหรับรักษา HAPE (ฤทธิ์ขับปัสสาวะอาจทำให้ความดันต่ำในผู้ที่ขาดน้ำในหลอดเลือด)"],s:"wms24",c:"strong, moderate / weak, moderate",p:"HAPE sections",h:"stop"}]},{k:"icp",n:["Raised intracranial pressure","ความดันในกะโหลกศีรษะสูง"],color:"border-l-fuchsia-500",ids:["mannitol","furosemide"],sh:["ICP","ICP"],qa:{first:["No agent is proven; hyperosmolar therapy may lower ICP (BTF)","ยังไม่มียาที่พิสูจน์ว่าดีที่สุด ยา hyperosmolar อาจลด ICP (BTF)"],add:["TBI: hypertonic saline suggested over mannitol; mannitol if hypertonic saline cannot be given (NCS)","บาดเจ็บศีรษะ: แนะนำ hypertonic saline มากกว่า mannitol และใช้ mannitol เมื่อให้ hypertonic saline ไม่ได้ (NCS)"],watch:["Osmolar gap and renal function during mannitol; hypotension if given in under 5 minutes","osmolar gap และการทำงานของไตระหว่างให้ mannitol และความดันต่ำถ้าให้เร็วกว่า 5 นาที"],avoid:["Scheduled prophylactic mannitol in ischaemic stroke; mannitol pre-hospital in TBI","mannitol ป้องกันตามเวลาในโรคหลอดเลือดสมองขาดเลือด และ mannitol นอกโรงพยาบาลในบาดเจ็บศีรษะ"]},items:[{t:["Severe TBI: hyperosmolar therapy may lower ICP, but there was not enough evidence on clinical outcomes to recommend any specific agent. The 3rd-edition statements (mannitol 0.25–1 g/kg; avoid systolic BP below 90 mmHg; before ICP monitoring, use mannitol only with signs of herniation or progressive deterioration) were not carried forward because their evidence no longer met the standard.","บาดเจ็บศีรษะรุนแรง: ยา hyperosmolar อาจลด ICP ได้ แต่หลักฐานด้านผลลัพธ์ทางคลินิกไม่พอที่จะแนะนำยาตัวใดตัวหนึ่ง ข้อความในฉบับที่ 3 (mannitol 0.25–1 ก./กก. หลีกเลี่ยงความดันซิสโตลิกต่ำกว่า 90 mmHg และก่อนมี ICP monitoring ให้ใช้ mannitol เฉพาะเมื่อมีสัญญาณ herniation หรืออาการทรุดลงต่อเนื่อง) ไม่ได้ยกมาในฉบับที่ 4 เพราะหลักฐานไม่ถึงเกณฑ์ปัจจุบัน"],s:"btf4",p:"p. 49–50",h:"over"},{t:["TBI: hypertonic saline is suggested over mannitol for initial management of raised ICP or cerebral oedema; mannitol is an effective alternative when hypertonic saline cannot be given; neither should be used expecting better neurological outcomes; against mannitol in the pre-hospital setting.","บาดเจ็บศีรษะ: แนะนำ hypertonic saline มากกว่า mannitol เป็นการรักษาเริ่มแรกของ ICP สูงหรือสมองบวม mannitol เป็นทางเลือกที่ได้ผลเมื่อให้ hypertonic saline ไม่ได้ ไม่ควรใช้ทั้งสองอย่างโดยหวังให้ผลลัพธ์ทางระบบประสาทดีขึ้น และแนะนำไม่ใช้ mannitol นอกโรงพยาบาล"],s:"ncs20",c:"conditional, low (pre-hospital: very low)",h:"tx"},{t:["Ischaemic stroke: either hypertonic saline or mannitol for initial management; consider hypertonic saline if the response to mannitol is inadequate; against scheduled prophylactic mannitol because of possible harm.","โรคหลอดเลือดสมองขาดเลือด: ใช้ hypertonic saline หรือ mannitol เป็นการรักษาเริ่มแรกก็ได้ พิจารณา hypertonic saline เมื่อตอบสนองต่อ mannitol ไม่เพียงพอ และแนะนำไม่ใช้ mannitol ป้องกันตามเวลาเพราะอาจเป็นอันตราย"],s:"ncs20",c:"conditional, low",h:"tx"},{t:["Intracerebral haemorrhage: hypertonic saline is suggested over mannitol (very low-quality evidence). Hepatic encephalopathy: either agent (very low-quality evidence).","เลือดออกในเนื้อสมอง: แนะนำ hypertonic saline มากกว่า mannitol (หลักฐานคุณภาพต่ำมาก) ภาวะสมองเสื่อมจากตับ: ใช้ได้ทั้งสองชนิด (หลักฐานคุณภาพต่ำมาก)"],s:"ncs20",c:"conditional, very low",h:"tx"},{t:["Spontaneous intracerebral haemorrhage: the benefit of early prophylactic hyperosmolar therapy for outcome is not well established (COR 2b, LOE B-NR); bolus hyperosmolar therapy may be considered to reduce ICP transiently (COR 2b, LOE C-LD).","เลือดออกในเนื้อสมองที่เกิดเอง: ประโยชน์ของการให้ยา hyperosmolar ป้องกันตั้งแต่ต้นต่อผลลัพธ์ยังไม่ชัดเจน (COR 2b, LOE B-NR) และอาจพิจารณาให้แบบฉีดเป็นครั้งเพื่อลด ICP ชั่วคราว (COR 2b, LOE C-LD)"],s:"ich22",c:"2b B-NR / 2b C-LD",p:"Section 5.5",h:"tx"},{t:["Mannitol dose: below 0.5 g/kg works less well and for a shorter time; 0.5–2.5 g/kg gave a larger, more lasting ICP fall. Give as a rapid IV bolus, not a continuous infusion; over 10–20 minutes to avoid hypotension (more likely if given in under 5 minutes).","ขนาด mannitol: ต่ำกว่า 0.5 ก./กก. ได้ผลน้อยและสั้นกว่า ขนาด 0.5–2.5 ก./กก. ลด ICP ได้มากและนานกว่า ให้แบบฉีดเร็วเป็นครั้ง ไม่ให้หยดต่อเนื่อง และให้ในเวลา 10–20 นาทีเพื่อเลี่ยงความดันต่ำ (พบบ่อยขึ้นถ้าให้เร็วกว่า 5 นาที)"],s:"ccsap",p:"PDF p. 16",h:"dose"},{t:["Mannitol also acts as a diuretic, which is undesirable in a hypotensive patient, so replace lost intravascular volume; hypertonic saline can be hazardous in a hyponatremic patient.","mannitol มีฤทธิ์ขับปัสสาวะซึ่งไม่เหมาะกับผู้ป่วยความดันต่ำ จึงต้องชดเชยปริมาตรในหลอดเลือดที่สูญเสียไป ส่วน hypertonic saline อาจเป็นอันตรายในผู้ป่วยโซเดียมต่ำ"],s:"btf4",p:"p. 49",h:"safe"},{t:["During mannitol, use the osmolar gap rather than serum osmolarity thresholds to watch for AKI (very low-quality evidence), and monitor renal function closely (good practice statement).","ระหว่างให้ mannitol ใช้ osmolar gap แทนค่า serum osmolarity ในการเฝ้าระวังไตวายเฉียบพลัน (หลักฐานคุณภาพต่ำมาก) และติดตามการทำงานของไตอย่างใกล้ชิด (good practice statement)"],s:"ncs20",c:"conditional, very low",h:"safe"},{t:["Mannitol-induced AKI o
