itate encephalopathy.",th:"ไต: ไม่ต้องลดขนาด แต่ต้องใช้ขนาดสูงขึ้นเมื่อ eGFR ลดลง (ceiling IV bolus 80–160 mg ใน CKD ดูหัวข้อดื้อยา) ไม่ได้ผลเมื่อไม่มีปัสสาวะ ตับ: ตับแข็งเริ่มขนาดต่ำและให้คู่ spironolactone โพแทสเซียมต่ำหรือภาวะด่างอาจกระตุ้นสมองเสื่อมจากตับ"},bumetanide:{en:"Kidney: higher doses are needed as eGFR falls (1 mg ≈ furosemide 40 mg PO); no effect in anuria. Liver: avoid in hepatic coma; titrate carefully in cirrhosis.",th:"ไต: ต้องใช้ขนาดสูงขึ้นเมื่อ eGFR ลดลง (1 mg ≈ furosemide 40 mg PO) ไม่ได้ผลเมื่อไม่มีปัสสาวะ ตับ: หลีกเลี่ยงในภาวะโคม่าจากตับ ตับแข็งปรับขนาดอย่างระมัดระวัง"},torsemide:{en:"Kidney: mostly cleared by the liver, so it does not accumulate in CKD; higher doses may still be needed at low eGFR. Liver: half-life is longer in cirrhosis; contraindicated in hepatic coma.",th:"ไต: ส่วนใหญ่ถูกกำจัดทางตับ จึงไม่สะสมใน CKD แต่ eGFR ต่ำอาจต้องใช้ขนาดสูงขึ้น ตับ: ครึ่งชีวิตยาวขึ้นในตับแข็ง ห้ามใช้ในภาวะโคม่าจากตับ"},ethacrynic:{en:"Kidney: contraindicated in anuria; larger doses are needed as eGFR falls. Liver: use with caution in cirrhosis (electrolyte shifts can precipitate hepatic coma).",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ต้องใช้ขนาดสูงขึ้นเมื่อ eGFR ลดลง ตับ: ระวังในตับแข็ง (อิเล็กโทรไลต์เปลี่ยนอาจกระตุ้นโคม่าจากตับ)"},hctz:{en:"Kidney: much less effective at eGFR < 30 (add or switch to a loop); contraindicated in anuria and severe renal impairment on most labels. Liver: in cirrhosis small fluid or electrolyte shifts can precipitate hepatic coma.",th:"ไต: ได้ผลน้อยลงมากเมื่อ eGFR < 30 (เพิ่มหรือเปลี่ยนเป็นยาลูป) ห้ามใช้ในภาวะไม่มีปัสสาวะและไตเสื่อมรุนแรงตามฉลากส่วนใหญ่ ตับ: ในตับแข็ง การเปลี่ยนของน้ำหรืออิเล็กโทรไลต์เล็กน้อยอาจกระตุ้นโคม่าจากตับ"},chlorthalidone:{en:"Kidney: still lowers BP in stage 4 CKD (CLICK; watch K⁺ and creatinine). Liver: as for HCTZ, small electrolyte shifts can precipitate hepatic coma in cirrhosis.",th:"ไต: ยังลดความดันได้ใน CKD ระยะ 4 (CLICK ติดตาม K⁺ และ creatinine) ตับ: เช่นเดียวกับ HCTZ อิเล็กโทรไลต์เปลี่ยนเล็กน้อยอาจกระตุ้นโคม่าจากตับในตับแข็ง"},indapamide:{en:"Kidney: contraindicated in severe renal failure (CrCl < 30 mL/min on the UK SmPC). Liver: contraindicated in hepatic encephalopathy or severe liver impairment.",th:"ไต: ห้ามใช้ในไตวายรุนแรง (CrCl < 30 mL/min ตาม UK SmPC) ตับ: ห้ามใช้ในสมองเสื่อมจากตับหรือตับบกพร่องรุนแรง"},metolazone:{en:"Kidney: keeps working at low GFR, which is why it pairs with a loop; contraindicated in anuria; check K⁺, Na⁺ and creatinine daily. Liver: contraindicated in hepatic coma or pre-coma.",th:"ไต: ยังออกฤทธิ์ได้เมื่อ GFR ต่ำ จึงใช้คู่กับยาลูป ห้ามใช้เมื่อไม่มีปัสสาวะ ตรวจ K⁺, Na⁺, creatinine ทุกวัน ตับ: ห้ามใช้ในภาวะโคม่าหรือก่อนโคม่าจากตับ"},chlorothiazide:{en:"Kidney: contraindicated in anuria; check electrolytes and creatinine daily when added to a loop. Liver: caution in cirrhosis (hepatic coma).",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ตรวจอิเล็กโทรไลต์และ creatinine ทุกวันเมื่อเสริมยาลูป ตับ: ระวังในตับแข็ง (โคม่าจากตับ)"},spironolactone:{en:"Kidney: HF guidance: use only if eGFR > 30 and K⁺ < 5.0; at eGFR 30–49 start 12.5 mg daily or on alternate days. Liver: first-line for cirrhotic ascites (100–400 mg/day); check K⁺ and creatinine.",th:"ไต: แนวทาง HF: ใช้เมื่อ eGFR > 30 และ K⁺ < 5.0 ถ้า eGFR 30–49 เริ่ม 12.5 mg ทุกวันหรือวันเว้นวัน ตับ: ยาเลือกแรกในท้องมานจากตับแข็ง (100–400 mg/วัน) ตรวจ K⁺ และ creatinine"},eplerenone:{en:"Kidney: contraindicated if eGFR < 30 or K⁺ > 5.0 at start (EU SmPC). Liver: contraindicated in severe impairment (Child-Pugh C).",th:"ไต: ห้ามใช้ถ้า eGFR < 30 หรือ K⁺ > 5.0 ตอนเริ่ม (EU SmPC) ตับ: ห้ามใช้ในตับบกพร่องรุนแรง (Child-Pugh C)"},amiloride:{en:"Kidney: contraindicated in anuria, acute or severe progressive renal failure, diabetic nephropathy and hyperkalemia. Liver: not metabolised by the liver; may accumulate in hepatorenal syndrome.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ ไตวายเฉียบพลันหรือไตวายรุนแรงที่ลุกลาม โรคไตจากเบาหวาน และโพแทสเซียมสูง ตับ: ไม่ถูกเผาผลาญที่ตับ อาจสะสมใน hepatorenal syndrome"},triamterene:{en:"Kidney: contraindicated in anuria, severe or progressive kidney disease and hyperkalemia. Liver: caution in cirrhosis (folate antagonist effect).",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ โรคไตรุนแรงหรือลุกลาม และโพแทสเซียมสูง ตับ: ระวังในตับแข็ง (ฤทธิ์ต้านโฟเลต)"},tolvaptan:{en:"Kidney: contraindicated in anuria; no benefit when there is no urine output. Liver: can cause serious liver injury: avoid with underlying liver disease and stop if ALT / AST rise. Start in hospital with Na⁺ checks.",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ไม่ได้ประโยชน์เมื่อไม่มีปัสสาวะ ตับ: อาจทำให้ตับอักเสบรุนแรง หลีกเลี่ยงในโรคตับเดิมและหยุดเมื่อ ALT / AST สูงขึ้น เริ่มในโรงพยาบาลและตรวจ Na⁺"},dapagliflozin:{en:"Kidney: for HF / CKD it can be started at eGFR ≥ 15 (UK) and continued below that; the glucose-lowering effect falls at eGFR < 45. Liver: severe impairment: start 5 mg.",th:"ไต: ใน HF / CKD เริ่มได้เมื่อ eGFR ≥ 15 (UK) และใช้ต่อได้แม้ต่ำกว่านั้น ฤทธิ์ลดน้ำตาลลดลงเมื่อ eGFR < 45 ตับ: ตับบกพร่องรุนแรง เริ่ม 5 mg"},empagliflozin:{en:"Kidney: for HF / CKD it can be started at eGFR ≥ 20 (UK) and continued below that; the glucose-lowering effect falls at low eGFR. Liver: no dose adjustment.",th:"ไต: ใน HF / CKD เริ่มได้เมื่อ eGFR ≥ 20 (UK) และใช้ต่อได้แม้ต่ำกว่านั้น ฤทธิ์ลดน้ำตาลลดลงเมื่อ eGFR ต่ำ ตับ: ไม่ต้องปรับขนาด"},bendroflumethiazide:{en:"Kidney: contraindicated in severe renal insufficiency. Liver: contraindicated in severe hepatic insufficiency.",th:"ไต: ห้ามใช้ในไตเสื่อมรุนแรง ตับ: ห้ามใช้ในตับบกพร่องรุนแรง"},xipamide:{en:"Kidney: the leaflet allows up to 60 mg/day in advanced kidney impairment; do not go higher. Liver: contraindicated in severe liver dysfunction; dose by severity in milder impairment.",th:"ไต: เอกสารกำกับยาอนุญาตสูงสุด 60 mg/วันในไตเสื่อมระยะรุนแรง ไม่ควรสูงกว่านี้ ตับ: ห้ามใช้ในตับบกพร่องรุนแรง ในระดับเบากว่าให้ปรับตามความรุนแรง"},canrenoate:{en:"Kidney: do not give in renal failure (Japan label): K⁺ excretion is low and hyperkalemia worsens. Check K⁺ regularly.",th:"ไต: ห้ามใช้ในไตวาย (ฉลากญี่ปุ่น) เพราะขับ K⁺ ได้น้อยและโพแทสเซียมสูงแย่ลง ตรวจ K⁺ สม่ำเสมอ"},trichlormethiazide:{en:"Kidney: contraindicated in anuria and acute renal failure; start low in older adults.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะและไตวายเฉียบพลัน ผู้สูงอายุเริ่มขนาดต่ำ"},azosemide:{en:"Kidney: contraindicated in anuria. Liver: contraindicated in hepatic coma.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ ตับ: ห้ามใช้ในภาวะโคม่าจากตับ"},esaxerenone:{en:"Kidney: contraindicated at eGFR < 30 or K⁺ > 5.0 at start (Japan label); check K⁺ more often in diabetes with albuminuria.",th:"ไต: ห้ามใช้เมื่อ eGFR < 30 หรือ K⁺ > 5.0 ตอนเริ่ม (ฉลากญี่ปุ่น) ตรวจ K⁺ ถี่ขึ้นในเบาหวานที่มีอัลบูมินในปัสสาวะ"}},DDI_KS=[["ACEi / ARB / ARNI, potassium supplements, trimethoprim, heparin and other K-sparing drugs: hyperkalemia. Check K⁺ and creatinine after any change.","ACEi / ARB / ARNI, โพแทสเซียมเสริม, trimethoprim, heparin และยาประหยัดโพแทสเซียมอื่น: โพแทสเซียมสูง ตรวจ K⁺ และ creatinine หลังเปลี่ยนยา"],["NSAIDs: hyperkalemia and AKI.","NSAIDs: โพแทสเซียมสูงและ AKI"],["Lithium: levels can rise.","Lithium: ระดับยาอาจสูงขึ้น"]],DDI={loop:[['NSAIDs blunt the diuretic effect and raise AKI risk, especially with an ACEi / ARB ("triple whammy").','NSAIDs ลดฤทธิ์ขับปัสสาวะและเพิ่มความเสี่ยง AKI โดยเฉพาะเมื่อใช้ร่วม ACEi / ARB ("triple whammy")'],["Aminoglycosides, cisplatin: additive ototoxicity and nephrotoxicity.","Aminoglycosides, cisplatin: พิษต่อหูและไตเสริมกัน"],["Digoxin, QT-prolonging drugs: hypokalemia and hypomagnesemia raise toxicity and arrhythmia risk.","Digoxin, ยาที่ยืด QT: K⁺ และ Mg²⁺ ต่ำเพิ่มความเสี่ยงพิษและหัวใจเต้นผิดจังหวะ"],["Lithium: levels can rise; monitor.","Lithium: ระดับยาอาจสูงขึ้น ควรติดตาม"]],thz:[["Lithium: clearance falls and toxicity can follow; avoid or monitor levels.","Lithium: การขับออกลดลงและเกิดพิษได้ ควรหลีกเลี่ยงหรือติดตามระดับยา"],["NSAIDs blunt the diuretic and antihypertensive effect.","NSAIDs ลดฤทธิ์ขับปัสสาวะและลดความดัน"],["Digoxin, QT-prolonging drugs: hypokalemia and hypomagnesemia raise toxicity and arrhythmia risk.","Digoxin, ยาที่ยืด QT: K⁺ และ Mg²⁺ ต่ำเพิ่มความเสี่ยงพิษและหัวใจเต้นผิดจังหวะ"],["Calcium or vitamin D supplements: hypercalcemia.","แคลเซียมหรือวิตามินดีเสริม: แคลเซียมสูง"],["Glucose-lowering drugs: thiazides can raise glucose, so doses may need to go up.","ยาลดน้ำตาล: ไทอาไซด์อาจทำให้น้ำตาลสูงขึ้น อาจต้องเพิ่มขนาดยา"]],mra:DDI_KS,enac:DDI_KS,cai:[["High-dose aspirin (salicylates): accumulation and toxicity, especially in renal impairment.","Aspirin ขนาดสูง (salicylates): ยาสะสมและเกิดพิษ โดยเฉพาะในไตเสื่อม"],["Other diuretics and corticosteroids: additive hypokalemia.","ยาขับปัสสาวะอื่นและคอร์ติโคสเตียรอยด์: โพแทสเซียมต่ำเสริมกัน"]],v2:[["Strong CYP3A4 inhibitors (ketoconazole, itraconazole, clarithromycin) are contraindicated: ketoconazole raised exposure about 5-fold.","ยายับยั้ง CYP3A4 แรง (ketoconazole, itraconazole, clarithromycin) ห้ามใช้ร่วม: ketoconazole เพิ่มระดับยาราว 5 เท่า"],["CYP3A4 inducers (rifampin): weaker effect.","ตัวกระตุ้น CYP3A4 (rifampin): ฤทธิ์ลดลง"],["Avoid hypertonic saline; keep the Na⁺ rise ≤ 8–10 mmol/L per 24 h (ODS).","หลีกเลี่ยง hypertonic saline และคุมการเพิ่ม Na⁺ ≤ 8–10 mmol/L ต่อ 24 ชม. (ODS)"]],sglt:[["Insulin and sulfonylureas: hypoglycemia; the dose may need to be lowered.","Insulin และ sulfonylureas: น้ำตาลต่ำ อาจต้องลดขนาดยา"],["Loop or thiazide diuretics: additive volume depletion and hypotension.","ยาลูปหรือไทอาไซด์: ขาดน้ำและความดันต่ำเสริมกัน"]]},DDI_X={eplerenone:[["Contraindicated: strong CYP3A4 inhibitors (itraconazole, ketoconazole, ritonavir, clarithromycin) and other K-sparing diuretics or K⁺ supplements. With moderate inhibitors (amiodarone, diltiazem, verapamil) the dose is capped at 25 mg.","ห้ามใช้ร่วม: ยายับยั้ง CYP3A4 แรง (itraconazole, ketoconazole, ritonavir, clarithromycin) และยาขับปัสสาวะประหยัดโพแทสเซียมหรือโพแทสเซียมเสริม ถ้าใช้กับตัวยับยั้งปานกลาง (amiodarone, diltiazem, verapamil) จำกัดไม่เกิน 25 mg"]],canrenoate:[["Contraindicated with eplerenone and tacrolimus (Japan label).","ห้ามใช้ร่วมกับ eplerenone และ tacrolimus (ฉลากญี่ปุ่น)"]],esaxerenone:[["Contraindicated with eplerenone, K-sparing diuretics and K⁺ supplements (Japan label).","ห้ามใช้ร่วมกับ eplerenone ยาขับปัสสาวะประหยัดโพแทสเซียม และโพแทสเซียมเสริม (ฉลากญี่ปุ่น)"]]},ddiOf=e=>[...DDI[e.cls]||[],...DDI_X[e.id]||[]],CONV={head:[["Drug","ยา"],["Equivalent dose","ขนาดเทียบเท่า"],["Oral bioavailability","การดูดซึมทางปาก"]],rows:[["Furosemide PO","furosemide กิน","40 mg","≈ 50% (10–100%)"],["Furosemide IV","furosemide ฉีด","20 mg","—"],["Bumetanide PO / IV","bumetanide กิน / ฉีด","1 mg","80–100%"],["Torsemide PO / IV","torsemide กิน / ฉีด","20 mg","80–100%"],["Ethacrynic acid PO","ethacrynic acid กิน","≈ 50 mg","N/A"]],notes:[["Equivalence is for natriuretic potency at usual doses: start from the equivalent dose and titrate to urine output.","ขนาดเทียบเท่าคิดจากฤทธิ์ขับโซเดียมที่ขนาดปกติ ให้เริ่มจากขนาดเทียบเท่าแล้วปรับตามปริมาณปัสสาวะ"],["Furosemide IV : PO is about 1 : 2. Switch to bumetanide or torsemide when gut edema makes furosemide absorption unreliable.","furosemide IV : PO ประมาณ 1 : 2 เปลี่ยนเป็น bumetanide หรือ torsemide เมื่อลำไส้บวมทำให้การดูดซึม furosemide ไม่แน่นอน"],["Furosemide IV bolus ceiling: normal kidney 40 mg, CKD 80–160 mg, HF 40–160 mg; a higher dose then needs a shorter interval, not a larger bolus (see the resistance guide).","ceiling ของ furosemide IV bolus: ไตปกติ 40 mg, CKD 80–160 mg, HF 40–160 mg เกินนี้ให้ลดช่วงห่างระหว่างโดส ไม่ใช่เพิ่ม bolus (ดูหัวข้อดื้อยา)"],["Thiazide-type: chlorthalidone is roughly 1.5–2 times as potent per mg as HCTZ and acts 40–60 h (approximate).","ไทอาไซด์: chlorthalidone แรงกว่า HCTZ ต่อ mg ราว 1.5–2 เท่า และออกฤทธิ์ 40–60 ชม. (โดยประมาณ)"]],src:"Brater DC. NEJM 1998;339:387; Mullens W et al. Eur J Heart Fail 2019;21:137 (ESC HFA). Approximate values: check the local protocol."};function ConvertModal({onClose:e,lang:t}){const a="th"===t?1:0;return React.createElement(Modal,
