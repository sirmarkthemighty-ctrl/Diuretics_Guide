riamterene, xipamide and canrenoate.","New Which diuretic for what guide (heart failure, cirrhosis with ascites, hypertension, CKD, nephrotic oedema, hyponatremia, acute angle-closure glaucoma, altitude illness, raised intracranial pressure), every line with its source and class/level; every line shows its source, class and level. The guide is now a table (recommendation | source and level) that stacks on phones, with topic sub-headings, a quick-answer box, jump chips, and one row for lines several sources agree on; chips coloured by recommendation strength, doses and thresholds in bold, coloured topic headings with a topic filter, and a larger quick-answer box and all listed guidelines have been read: also the WMS 2024 altitude update, ESH 2023, AHA/ASA ICH 2022, the AAO open-angle glaucoma pattern, the 2013 hyponatremia panel, the Brain Trauma Foundation 4th edition and the Neurocritical Care Society 2020 guideline. On a phone the filter panel now starts closed (open on larger screens). Drug cards re-ordered: dose first, then electrolytes, serious and common side effects, and a separate availability block (countries and NLEM, NLEM now an outlined tag); brands sit directly under the name; the site became a plain line under the name and the trial-evidence tag was removed from the main-page cards (it stays in the detail view and the comparison); the dose lines are a small table; chips are a little larger. The Dose conversion tool is renamed Loop dose conversion (button and window title). A small route icon (tablet for oral, drop for intravenous) now sits before each dose line that names PO or IV, on cards, in the detail view, the comparison and the table. Drug cards: brands are a labelled text line (no second country chip), the site and evidence chips carry a label (full site name on hover), registered countries share one colour, the Compare and Details buttons have words and sit in the top-right corner of the card, serious and common side effects are labelled, and acetazolamide’s resistance dose sits under a divider. New Compact switch hides the site, evidence, NLEM, country and common side-effect rows. New Check interactions button in each drug’s detail view: it opens the Interactions screen for that drug, listing the medicines flagged for it (Avoid first) that you tap to add. Interactions screen: medicines grouped with a search box, a selected row with Clear all, a count of Avoid / Caution / None listed, results split by severity, and the no-interaction list folded; larger tap targets on phones. Filters are remembered between visits; Copy summary button in each drug’s detail view; disclaimer now covers the new tools.","Four more PubMed trials (azosemide, ethacrynic acid, torasemide vs azosemide, esaxerenone vs trichlormethiazide); UK status of triamterene is now “past” (Dytac discontinued).","Thai drug names removed (drugs are shown by their international names). Evidence level: each trial is tagged by design, endpoint and result, and each card shows the best trial evidence. The Mechanism diagram now shares the electrolyte filter: pick K⁺↓ (or any effect) and the sites of every matching drug light up.","New tools: Kidney check (eGFR, K⁺ and liver sort the drugs into avoid / caution / no restriction), Interactions (pick the patient’s other drugs), Compare (select 2 or more drugs), and a next-step helper in the resistance guide.","Thai brands checked in MIMS for every drug (dapagliflozin has three; the six added drugs have none); two more PubMed trials (DAPA-RESIST, chlorthalidone / HCTZ / amiloride).","Market (brand) names on every card, in a Brands column and by country in the detail view; search also finds brand names.","Electrolyte filter in two rows (increased on top, decreased below, same electrolyte stacked): pick several electrolytes, one direction each; the other arrow switches it.","Warning triangle on serious side effects (hyperkalemia, ototoxicity, liver injury, ODS, DKA, blood-count drops, AKI, pulmonary edema) on งอื่นยังเป็น “?” พร้อมบันทึกการตรวจ ตรวจสถานะญี่ปุ่นซ้ำกับ PMDA: triamterene มีจำหน่าย (Triteren) bumetanide เคยมีแต่เลิกแล้ว 5 ตัวไม่พบใน PMDA และเพิ่มการศึกษาของ bumetanide, triamterene, xipamide, canrenoate","คู่มือเลือกยาขับปัสสาวะตามข้อบ่งใช้ใหม่ (หัวใจล้มเหลว ตับแข็งที่มีท้องมาน ความดันโลหิตสูง โรคไตเรื้อรัง ภาวะบวมจากไตเนโฟรติก โซเดียมต่ำ ต้อหินมุมปิดเฉียบพลัน โรคแพ้ที่สูง ความดันในกะโหลกศีรษะสูง) แต่ละบรรทัดมีแหล่งที่มา ระดับคำแนะนำและหลักฐาน ตอนนี้แสดงเป็นตาราง (ข้อแนะนำ | แหล่งและระดับ) ที่เรียงซ้อนบนมือถือ มีหัวข้อย่อยตามหัวเรื่อง กล่องสรุปเร็ว ปุ่มข้ามไปยังข้อบ่งใช้ และรวมบรรทัดที่หลายแหล่งตรงกันเป็นแถวเดียว ชิปสีตามความแรงของคำแนะนำ ขนาดยาและค่าเกณฑ์เป็นตัวหนา หัวข้อย่อยมีสีและตัวกรองหัวข้อ และกล่องสรุปเร็วใหญ่ขึ้น และอ่านครบทุกแนวทางที่ระบุไว้แล้ว รวมถึง WMS 2024 ESH 2023 AHA/ASA ICH 2022 แนวทางต้อหินมุมเปิดของ AAO แนวทางโซเดียมต่ำปี 2013 Brain Trauma Foundation ฉบับที่ 4 และ Neurocritical Care Society 2020 บนมือถือแผงตัวกรองเริ่มต้นแบบปิด (หน้าจอใหญ่ยังเปิดอยู่) จัดการ์ดยาใหม่: ขนาดยาก่อน ตามด้วยอิเล็กโทรไลต์ ผลข้างเคียงที่สำคัญและที่พบบ่อย และส่วนการจำหน่ายแยกต่างหาก (ประเทศและ NLEM โดย NLEM เป็นป้ายขอบเส้น) และยี่ห้ออยู่ใต้ชื่อยาโดยตรง ตำแหน่งเป็นบรรทัดข้อความใต้ชื่อ และเอาป้ายหลักฐานจากการศึกษาออกจากการ์ดหน้าหลัก (ยังอยู่ในหน้ารายละเอียดและการเปรียบเทียบ) บรรทัดขนาดยาเป็นตารางเล็ก และชิปใหญ่ขึ้นเล็กน้อย เครื่องมือเทียบขนาดยาเปลี่ยนชื่อเป็นเทียบขนาดยากลุ่มลูป (ปุ่มและหัวหน้าต่าง) ไอคอนทางให้ยาขนาดเล็ก (เม็ดยาสำหรับรับประทาน หยดน้ำสำหรับฉีดเข้าหลอดเลือดดำ) อยู่หน้าบรรทัดขนาดยาที่ระบุ PO หรือ IV บนการ์ด หน้ารายละเอียด การเปรียบเทียบ และตาราง การ์ดยา: ยี่ห้อเป็นข้อความมีป้ายกำกับ (ไม่มีชิปประเทศซ้ำ) ชิปตำแหน่งและหลักฐานมีป้ายกำกับ (ชื่อเต็มเมื่อชี้) ประเทศที่ขึ้นทะเบียนใช้สีเดียวกัน ปุ่มเปรียบเทียบและรายละเอียดมีข้อความและอยู่มุมขวาบนของการ์ด ผลข้างเคียงที่สำคัญและที่พบบ่อยมีป้ายกำกับ และขนาดยากรณีดื้อยาของ acetazolamide อยู่ใต้เส้นแบ่ง สวิตช์แบบย่อใหม่ซ่อนแถวตำแหน่ง หลักฐาน NLEM ประเทศ และผลข้างเคียงที่พบบ่อย ปุ่มตรวจปฏิกิริยายาใหม่ในหน้ารายละเอียดของ ่ำอาจต้องใช้ขนาดสูงขึ้น ตับ: ครึ่งชีวิตยาวขึ้นในตับแข็ง ห้ามใช้ในภาวะโคม่าจากตับ"},ethacrynic:{en:"Kidney: contraindicated in anuria; larger doses are needed as eGFR falls. Liver: use with caution in cirrhosis (electrolyte shifts can precipitate hepatic coma).",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ต้องใช้ขนาดสูงขึ้นเมื่อ eGFR ลดลง ตับ: ระวังในตับแข็ง (อิเล็กโทรไลต์เปลี่ยนอาจกระตุ้นโคม่าจากตับ)"},hctz:{en:"Kidney: much less effective at eGFR < 30 (add or switch to a loop); contraindicated in anuria and severe renal impairment on most labels. Liver: in cirrhosis small fluid or electrolyte shifts can precipitate hepatic coma.",th:"ไต: ได้ผลน้อยลงมากเมื่อ eGFR < 30 (เพิ่มหรือเปลี่ยนเป็นยาลูป) ห้ามใช้ในภาวะไม่มีปัสสาวะและไตเสื่อมรุนแรงตามฉลากส่วนใหญ่ ตับ: ในตับแข็ง การเปลี่ยนของน้ำหรืออิเล็กโทรไลต์เล็กน้อยอาจกระตุ้นโคม่าจากตับ"},chlorthalidone:{en:"Kidney: still lowers BP in stage 4 CKD (CLICK; watch K⁺ and creatinine). Liver: as for HCTZ, small electrolyte shifts can precipitate hepatic coma in cirrhosis.",th:"ไต: ยังลดความดันได้ใน CKD ระยะ 4 (CLICK ติดตาม K⁺ และ creatinine) ตับ: เช่นเดียวกับ HCTZ อิเล็กโทรไลต์เปลี่ยนเล็กน้อยอาจกระตุ้นโคม่าจากตับในตับแข็ง"},indapamide:{en:"Kidney: contraindicated in severe renal failure (CrCl < 30 mL/min on the UK SmPC). Liver: contraindicated in hepatic encephalopathy or severe liver impairment.",th:"ไต: ห้ามใช้ในไตวายรุนแรง (CrCl < 30 mL/min ตาม UK SmPC) ตับ: ห้ามใช้ในสมองเสื่อมจากตับหรือตับบกพร่องรุนแรง"},metolazone:{en:"Kidney: keeps working at low GFR, which is why it pairs with a loop; contraindicated in anuria; check K⁺, Na⁺ and creatinine daily. Liver: contraindicated in hepatic coma or pre-coma.",th:"ไต: ยังออกฤทธิ์ได้เมื่อ GFR ต่ำ จึงใช้คู่กับยาลูป ห้ามใช้เมื่อไม่มีปัสสาวะ ตรวจ K⁺, Na⁺, creatinine ทุกวัน ตับ: ห้ามใช้ในภาวะโคม่าหรือก่อนโคม่าจากตับ"},chlorothiazide:{en:"Kidney: contraindicated in anuria; check electrolytes and creatinine daily when added to a loop. Liver: caution in cirrhosis (hepatic coma).",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ตรวจอิเล็กโทรไลต์และ creatinine ทุกวันเมื่อเสริมยาลูป ตับ: ระวังในตับแข็ง (โคม่าจากตับ)"},spironolactone:{en:"Kidney: HF guidance: use only if eGFR > 30 and K⁺ < 5.0; at eGFR 30–49 start 12.5 mg daily or on alternate days. Liver: first-line for cirrhotic ascites (100–400 mg/day); check K⁺ and creatinine.",th:"ไต: แนวทาง HF: ใช้เมื่อ eGFR > 30 และ K⁺ < 5.0 ถ้า eGFR 30–49 เริ่ม 12.5 mg ทุกวันหรือวันเว้นวัน ตับ: ยาเลือกแรกในท้องมานจากตับแข็ง (100–400 mg/วัน) ตรวจ K⁺ และ creatinine"},eplerenone:{en:"Kidney: contraindicated if eGFR < 30 or K⁺ > 5.0 at start (EU SmPC). Liver: contraindicated in severe impairment (Child-Pugh C).",th:"ไต: ห้ามใช้ถ้า eGFR < 30 หรือ K⁺ > 5.0 ตอนเริ่ม (EU SmPC) ตับ: ห้ามใช้ในตับบกพร่องรุนแรง (Child-Pugh C)"},amiloride:{en:"Kidney: contraindicated in anuria, acute or severe progressive renal failure, diabetic nephropathy and hyperkalemia. Liver: not metabolised by the liver; may accumulate in hepatorenal syndrome.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ ไตวายเฉียบพลันหรือไตวายรุนแรงที่ลุกลาม โรคไตจากเบาหวาน และโพแทสเซียมสูง ตับ: ไม่ถูกเผาผลาญที่ตับ อาจสะสมใน hepatorenal syndrome"},triamterene:{en:"Kidney: contraindicated in anuria, severe or progressive kidney disease and hyperkalemia. Liver: caution in cirrhosis (folate antagonist effect).",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ โรคไตรุนแรงหรือลุกลาม และโพแทสเซียมสูง ตับ: ระวังในตับแข็ง (ฤทธิ์ต้านโฟเลต)"},tolvaptan:{en:"Kidney: contraindicated in anuria; no benefit when there is no urine output. Liver: can cause serious liver injury: avoid with underlying liver disease and stop if ALT / AST rise. Start in hospital with Na⁺ checks.",th:"ไต: ห้ามใช้เมื่อไม่มีปัสสาวะ ไม่ได้ประโยชน์เมื่อไม่มีปัสสาวะ ตับ: อาจทำให้ตับอักเสบรุนแรง หลีกเลี่ยงในโรคตับเดิมและหยุดเมื่อ ALT / AST สูงขึ้น เริ่มในโรงพยาบาลและตรวจ Na⁺"},dapagliflozin:{en:"Kidney: for HF / CKD it can be started at eGFR ≥ 15 (UK) and continued below that; the glucose-lowering effect falls at eGFR < 45. Liver: severe impairment: start 5 mg.",th:"ไต: ใน HF / CKD เริ่มได้เมื่อ eGFR ≥ 15 (UK) และใช้ต่อได้แม้ต่ำกว่านั้น ฤทธิ์ลดน้ำตาลลดลงเมื่อ eGFR < 45 ตับ: ตับบกพร่องรุนแรง เริ่ม 5 mg"},empagliflozin:{en:"Kidney: for HF / CKD it can be started at eGFR ≥ 20 (UK) and continued below that; the glucose-lowering effect falls at low eGFR. Liver: no dose adjustment.",th:"ไต: ใน HF / CKD เริ่มได้เมื่อ eGFR ≥ 20 (UK) และใช้ต่อได้แม้ต่ำกว่านั้น ฤทธิ์ลดน้ำตาลลดลงเมื่อ eGFR ต่ำ ตับ: ไม่ต้องปรับขนาด"},bendroflumethiazide:{en:"Kidney: contraindicated in severe renal insufficiency. Liver: contraindicated in severe hepatic insufficiency.",th:"ไต: ห้ามใช้ในไตเสื่อมรุนแรง ตับ: ห้ามใช้ในตับบกพร่องรุนแรง"},xipamide:{en:"Kidney: the leaflet allows up to 60 mg/day in advanced kidney impairment; do not go higher. Liver: contraindicated in severe liver dysfunction; dose by severity in milder impairment.",th:"ไต: เอกสารกำกับยาอนุญาตสูงสุด 60 mg/วันในไตเสื่อมระยะรุนแรง ไม่ควรสูงกว่านี้ ตับ: ห้ามใช้ในตับบกพร่องรุนแรง ในระดับเบากว่าให้ปรับตามความรุนแรง"},canrenoate:{en:"Kidney: do not give in renal failure (Japan label): K⁺ excretion is low and hyperkalemia worsens. Check K⁺ regularly.",th:"ไต: ห้ามใช้ในไตวาย (ฉลากญี่ปุ่น) เพราะขับ K⁺ ได้น้อยและโพแทสเซียมสูงแย่ลง ตรวจ K⁺ สม่ำเสมอ"},trichlormethiazide:{en:"Kidney: contraindicated in anuria and acute renal failure; start low in older adults.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะและไตวายเฉียบพลัน ผู้สูงอายุเริ่มขนาดต่ำ"},azosemide:{en:"Kidney: contraindicated in anuria. Liver: contraindicated in hepatic coma.",th:"ไต: ห้ามใช้ในภาวะไม่มีปัสสาวะ ตับ: ห้ามใช้ในภาวะโคม่าจากตับ"},esaxerenone:{en:"Kidney: contraindicated at eGFR < 30 or K⁺ > 5.0 at start (Japan label); check K⁺ more often in diabetes with albuminuria.",th:"ไต: ห้ามใช้เมื่อ eGFR < 30 หรือ K⁺ > 5.0 ตอนเริ่ม (ฉลากญี่ปุ่น) ตรวจ K⁺ ถี่ขึ้นในเบาหวานที่มีอัลบูมินในปัสสาวะ"}},DDI_KS=[["ACEi / ARB / ARNI, potassium supplements, trimethoprim, heparin and other K-sparing drugs: hyperkalemia. Check K⁺ and creatinine after any change.","ACEi / ARB / ARNI, โพแทสเซียมเสริม, trimethoprim, heparin และยาประหยัดโพแทสเซียมอื่น: โพแทสเซียมสูง ตรวจ K⁺ และ creatinine หลังเปลี่ยนยา"],["NSAIDs: hyperkalemia and AKI.","NSAIDs: โพแทสเซียมสูงและ AKI"],["Lithium: levels can rise.","Lithium: ระดับยาอาจสูงขึ้น"]],DDI={loop:[['NSAIDs blunt the diuretic effect and raise AKI risk, especially with an ACEi / ARB ("triple whammy").','NSAIDs ลดฤทธิ์ขับปัสสาวะและเพิ่มความเสี่ยง AKI โดยเฉพาะเมื่อใช้ร่วม ACEi / ARB ("triple whammy")'],["Aminoglycosides, cisplatin: additive ototoxicity and nephrotoxicity.","Aminoglycosides, cisplatin: พิษต่อหูและไตเสริมกัน"],["Digoxin, QT-prolonging drugs: hypokalemia and hypomagnesemia raise toxicity and arrhythmia risk.","Digoxin, ยาที่ยืด QT: K⁺ และ Mg²⁺ ต่ำเพิ่มความเสี่ยงพิษและหัวใจเต้นผิดจังหวะ"],["Lithium: levels can rise; monitor.","Lithium: ระดับยาอาจสูงขึ้น ควรติดตาม"]],thz:[["Lithium: clearance falls and toxicity can follow; avoid or monitor levels.","Lithium: การขับออกลดลงและเกิดพิษได้ ควรหลีกเลี่ยงหรือติดตามระดับยา"],["NSAIDs blunt the diuretic and antihypertensive effect.","NSAIDs ลดฤทธิ์ขับปัสสาวะและลดความดัน"],["Digoxin, QT-prolonging drugs: hypokalemia and hypomagnesemia raise toxicity and arrhythmia risk.","Digoxin, ยาที่ยืด QT: K⁺ และ Mg²⁺ ต่ำเพิ่มความเสี่ยงพิษและหัวใจเต้นผิดจังหวะ"],["Calcium or vitamin D supplements: hypercalcemia.","แคลเซียมหรือวิตามินดีเสริม: แคลเซียมสูง"],["Glucose-lowering drugs: thiazides can raise glucose, so doses may need to go up.","ยาลดน้ำตาล: ไทอาไซด์อาจทำให้น้ำตาลสูงขึ้น อาจต้องเพิ่มขนาดยา"]],mra:DDI_KS,enac:DDI_KS,cai:[["High-dose aspirin (salicylates): accumulation and toxicity, especially in renal impairment.","Aspirin ขนาดสูง (salicylates): ยาสะสมและเกิดพิษ โดยเฉพาะในไตเสื่อม"],["Other diuretics and corticosteroids: additive hypokalemia.","ยาขับปัสสาวะอื่นและคอร์ติโคสเตียรอยด์: โพแทสเซียมต่ำเสริมกัน"]],v2:[["Strong CYP3A4 inhibitors (ketoconazole, itraconazole, clarithromycin) are contraindicated: ketoconazole raised exposure about 5-fold.","ยายับยั้ง CYP3A4 แรง (ketoconazole, itraconazole, clarithromycin) ห้ามใช้ร่วม: ketoconazole เพิ่มระดับยาราว 5 เท่า"],["CYP3A4 inducers (rifampin): weaker effect.","ตัวกระตุ้น CYP3A4 (rifampin): ฤทธิ์ลดลง"],["Avoid hypertonic saline; keep the Na⁺ rise ≤ 8–10 mmol/L per 24 h (ODS).","หลีกเลี่ยง hypertonic saline และคุมการเพิ่ม Na⁺ ≤ 8–10 mmol/L ต่อ 24 ชม. (ODS)"]],sglt:[["Insulin and sulfonylureas: hypoglycemia; the dose may need to be lowered.","Insulin และ sulfonylureas: น้ำตาลต่ำ อาจต้องลดขนาดยา"],["Loop or thiazide diuretics: additive volume depletion and hypotension.","ยาลูปหรือไทอาไซด์: ขาดน้ำและความดันต่ำเสริมกัน"]]},DDI_X={eplerenone:[["Contraindicated: strong CYP3A4 inhibitors (itraconazole, ketoconazole, ritonavir, clarithromycin) and other K-sparing diuretics or K⁺ supplements. With moderate inhibitors (amiodarone, diltiazem, verapamil) the dose is capped at 25 mg.","ห้ามใช้ร่วม: ยายับยั้ง CYP3A4 แรง (itraconazole, ketoconazole, ritonavir, clarithromycin) และยาขับปัสสาวะประหยัดโพแทสเซียมหรือโพแทสเซียมเสริม ถ้าใช้กับตัวยับยั้งปานกลาง (amiodarone, diltiazem, verapamil) จำกัดไม่เกิน 25 mg"]],canrenoate:[["Contraindicated with eplerenone and tacrolimus (Japan label).","ห้ามใช้ร่วมกับ eplerenone และ tacrolimus (ฉลากญี่ปุ่น)"]],esaxerenone:[["Contraindicated with eplerenone, K-sparing diuretics and K⁺ supplements (Japan label).","ห้ามใช้ร่วมกับ eplerenone ยาขับปัสสาวะประหยัดโพแทสเซียม และโพแทสเซียมเสริม (ฉลากญี่ปุ่น)"]]},ddiOf=e=>[...DDI[e.cls]||[],...DDI_X[e.id]||[]],CONV={head:[["Drug","ยา"],["Equivalent dose","ขนาดเทียบเท่า"],["Oral bioavailability","การดูดซึมทางปาก"]],rows:[["Furosemide PO","furosemide กิน","40 mg","≈ 50% (10–100%)"],["Furosemide IV","furosemide ฉีด","20 mg","—"],["Bumetanide PO / IV","bumetanide กิน / ฉีด","1 mg","80–100%"],["Torsemide PO / IV","torsemide กิน / ฉีด","20 mg","80–100%"],["Ethacrynic acid PO","ethacrynic acid กิน","≈ 50 mg","N/A"]],notes:[["Equivalence is for natriuretic potency at usual doses: start from the equivalent dose and titrate to urine output.","ขนาดเทียบเท่าคิดจากฤทธิ์ขับโซเดียมที่ขนาดปกติ ให้เริ่มจากขนาดเทียบเท่าแล้วปรับตามปริมาณปัสสาวะ"],["Furosemide IV : PO is about 1 : 2. Switch to bumetanide or torsemide when gut edema makes furosemide absorption unreliable.","furosemide IV : PO ประมาณ 1 : 2 เปลี่ยนเป็น bumetanide หรือ torsemide เมื่อลำไส้บวมทำให้การดูดซึม furosemide ไม่แน่นอน"],["Furosemide IV bolus ceiling: normal kidney 40 mg, CKD 80–160 mg, HF 40–160 mg; a higher dose then needs a shorter interval, not a larger bolus (see the resistance guide).","ceiling ของ furosemide IV bolus: ไตปกติ 40 mg, CKD 80–160 mg, HF 40–160 mg เกินนี้ให้ลดช่วงห่างระหว่างโดส ไม่ใช่เพิ่ม bolus (ดูหัวข้อดื้อยา)"],["Thiazide-type: chlorthalidone is roughly 1.5–2 times as potent per mg as HCTZ and acts 40–60 h (approximate).","ไทอาไซด์: chlorthalidone แรงกว่า HCTZ ต่อ mg ราว 1.5–2 เท่า และออกฤทธิ์ 40–60 ชม. (โดยประมาณ)"]],src:"Brater DC. NEJM 1998;339:387; Mullens W et al. Eur J Heart Fail 2019;21:137 (ESC HFA). Approximate values: check the local protocol."};function ConvertModal({onClose:e,lang:t}){const a="th"===t?1:0;return React.createElement(Modal,{title:TXT.conv[a],onClose:e,lang:t},React.createElement("div",{className:"overflow-x-auto"},React.createElement("table",{className:"w-full text-[12px] border-collapse"},React.createElement("thead",null,React.createElement("tr",null,CONV.head.map(((e,t)=>React.createElement("th",{key:t,className:"text-left py-1 pr-2 border-b border-slate-200 dark:border-[#263449] font-bold "+MUTED},e[a]))))),React.createElement("tbody",null,CONV.rows.map(((e,t)=>React.createElement("tr",{key:t,className:"border-b border-slate-100 dark:border-[#1c2a40]"},React.createElement("td",{className:"py-1.5 pr-2 font-semibold"},e[a]),React.createElement("td",{className:"py-1.5 pr-2 tabular-nums font-bold text-blue-700 dark:text-blue-300"},e[2]),React.createElement("td",{className:"py-1.5 tabular-nums"},e[3]))))))),React.createElement("ul",{className:"list-disc pl-4 space-y-1 text-[12px]"},CONV.notes.map(((e,t)=>React.createElement("li",{key:t},e[a])))),React.createElement("p",{className:"text-[10px] leading-snug "+MUTED},React.createElement("b",null,TXT.source[a],":")," ",CONV.src))}const R={def:[["Diuretic resistance = too little natriuresis or decongestion despite an adequate loop dose. A practical check after an IV loop dose: spot urine Na⁺ < 50–70 mmol/L at 2 h, or urine output < 100–150 mL/h over the first 6 h.","ดื้อยาขับปัสสาวะ = ขับโซเดียมหรือลดบวมได้ไม่พอแม้ได้ยาลูปขนาดเหมาะสม วิธีเช็คหลังให้ลูป IV: Na⁺ ในปัสสาวะ (spot) < 50–70 mmol/L ที่ 2 ชม. หรือปัสสาวะ < 100–150 mL/ชม. ใน 6 ชม.แรก"]],check:[["Non-adherence; high Na⁺ intake (aim < 2 g Na⁺/day)","ไม่ได้กินยา / กินเค็ม (เป้า Na⁺ < 2 g/วัน)"],["NSAIDs / COX-2 inhibitors (block prostaglandin-driven natriuresis)","NSAIDs / COX-2 (ลดการขับ Na⁺ ที่อาศัยพรอสตาแกลนดิน)"],["Poor absorption (gut edema): switch to IV, bumetanide or torsemide","ดูดซึมไม่ดี (ลำไส้บวม): เปลี่ยนเป็น IV, bumetanide หรือ torsemide"],["Dose below the ceiling or once-daily dosing → post-diuretic Na⁺ retention","ขนาดต่ำกว่า ceiling หรือให้วันละครั้ง → Na⁺ ถูกเก็บกลับหลังยาหมด"],["Low eGFR, nephrotic syndrome (albumin binds drug), low-output state, hypotension","eGFR ต่ำ, nephrotic (อัลบูมินจับยา), cardiac output ต่ำ, ความดันต่ำ"],['Distal nephron hypertrophy after chronic loop use (the "braking" phenomenon)',"เนฟรอนส่วนปลายโตจากใช้ลูปนาน (braking phenomenon)"]],steps:[{segs:["tal"],c:"border-l-blue-500",ids:["furosemide"],t:["Step 1: Optimise the loop (TAL)","ขั้น 1: ปรับยาลูป (TAL)"],b:["Give IV; double the dose until the response threshold, e.g. furosemide 40 → 80 → 160 mg IV (bolus ceiling ≈ 160–200 mg). Split BID, or bolus then infusion 10–20 mg/h. Typical ceiling bolus: normal kidney 40 mg, CKD 80–160 mg, HF 40–160 mg IV furosemide. Reassess urine Na⁺ / output at 2 and 6 h.","ให้ IV; เพิ่มขนาดเป็น 2 เท่าจนได้ผล เช่น furosemide 40 → 80 → 160 mg IV (ceiling ≈ 160–200 mg) แบ่งวันละ 2 ครั้ง หรือ bolus แล้วหยดต่อ 10–20 mg/ชม. ceiling โดยทั่วไป: ไตปกติ 40 mg, CKD 80–160 mg, HF 40–160 mg IV ประเมิน Na⁺ ปัสสาวะ/ปริมาณปัสสาวะที่ 2 และ 6 ชม."]},{segs:["tal","dct"],c:"border-l-emerald-500",ids:["furosemide","metolazone"],t:["Step 2: Add a thiazide-type (DCT)","ขั้น 2: เพิ่มยาไทอาไซด์ (DCT)"],b:["Metolazone 2.5–10 mg PO, or HCTZ 25–100 mg PO, or chlorothiazide 500–1000 mg IV, 30 min before the loop. Blocks the distal Na⁺ reabsorption that rises when the loop is blocked. Use for 1–3 days; check Na⁺, K⁺, Mg²⁺, creatinine daily (profound K⁺/Na⁺ loss is common).","Metolazone 2.5–10 mg PO หรือ HCTZ 25–100 mg PO หรือ chlorothiazide 500–1000 mg IV ก่อนยาลูป 30 นาที ปิดกั้นการดูดกลับ Na⁺ ส่วนปลายที่เพิ่มขึ้นเมื่อลูปถูกกั้น ใช้ 1–3 วัน ตรวจ Na⁺, K⁺, Mg²⁺, creatinine ทุกวัน (เสีย K⁺/Na⁺ มากได้บ่อย)"]},{segs:["pct"],c:"border-l-violet-500",ids:["furosemide","metolazone","acetazolamide"],t:["Step 3: Add acetazolamide (PCT)","ขั้น 3: เพิ่ม acetazolamide (PCT)"],b:["250–500 mg IV or PO daily for 1–3 days (ADVOR used 500 mg IV daily with the loop and improved decongestion). Most useful with metabolic alkalosis (HCO₃⁻ > 27). Watch for non-gap acidosis and hypokalemia.","250–500 mg IV หรือ PO วันละครั้ง 1–3 วัน (ADVOR ใช้ 500 mg IV วันละครั้งร่วมกับลูป ลดบวมได้ดีขึ้น) เหมาะสุดเมื่อมีภาวะด่าง (HCO₃⁻ > 27) ระวังภาวะกรดชนิด non-gap และโพแทสเซียมต่ำ"]},{segs:["cd"],c:"border-l-orange-500",ids:["furosemide","metolazone","acetazolamide","spironolactone"],t:["Step 4: Add MRA (CD), consider SGLT2i","ขั้น 4: เพิ่ม MRA (CD) พิจารณา SGLT2i"],b:["Spironolactone 25–100 mg daily (cirrhosis 100–400 mg). Counters K⁺ loss from the other blocks; check K⁺ and creatinine. SGLT2i adds mild natriuresis and outcome benefit in HF / CKD.","Spironolactone 25–100 mg วันละครั้ง (ตับแข็ง 100–400 mg) ช่วยลดการเสีย K⁺ จากยาตัวอื่น ตรวจ K⁺ และ creatinine ส่วน SGLT2i ช่วยขับ Na⁺ เล็กน้อยและลดผลลัพธ์ร้ายใน HF/CKD"]},{segs:[],c:"border-l-rose-500",ids:[],t:["Step 5: Extracorporeal","ขั้น 5: การกรองนอกร่างกาย"],b:["Ultrafiltration or renal replacement therapy when congestion persists despite sequential blockade, or with refractory hyperkalemia / acidosis / uremia.","Ultrafiltration หรือ RRT เมื่อยังบวมแม้ปิดกั้นตามลำดับแล้ว หรือมี K⁺ สูง/กรด/ยูเรียคั่งที่แก้ไม่ได้"]}],mon:[["Daily: weight, intake / output, Na⁺, K⁺ (keep ≥ 4.0), Mg²⁺ (keep ≥ 2.0 mg/dL in HF), HCO₃⁻, creatinine.","ทุกวัน: น้ำหนัก, intake/output, Na⁺, K⁺ (คง ≥ 4.0), Mg²⁺ (คง ≥ 2.0 mg/dL ใน HF), HCO₃⁻, creatinine"],["Stop or reduce the added drug for Na⁺ < 125 mmol/L, K⁺ < 3.0, symptomatic hypotension or a rapid creatinine rise.","หยุดหรือลดยาที่เพิ่ม เมื่อ Na⁺ < 125 mmol/L, K⁺ < 3.0, ความดันต่ำมีอาการ หรือ creatinine ขึ้นเร็ว"]],src:'Mullens W et al. Eur J Heart Fail 2019;21:137 (ESC HFA position statement on diuretics); Mullens W et al. NEJM 2022;387:1185 (ADVOR); Brater DC. NEJM 1998;339:387; ScienceDirect Topics, "Nephron" (Medicine and Dentistry), sciencedirect.com/topics/medicine-and-dentistry/nephron. Doses are typical adult values; verify against your local protocol.'};function ResistanceModal({onClose:e,lang:t,showCombo:a}){const i="th"===t?1:0;return React.createElement(Modal,{title:TXT.resist[i],onClose:e,lang:t},React.createElement("p",{className:"text-[12px] leading-relaxed"},R.def[0][i]),React.createElement(Fold,{title:i?"ตัวช่วยเลือกขั้นถัดไป":"Next-step helper",color:"border-l-indigo-500",open:!1},React.createElement(ResistanceHelper,{lang:t})),React.createElement(Fold,{title:i?"ตรวจสอบก่อนเพิ่มยา":"Check first",color:"border-l-amber-500"},React.createElement("ul",{className:"list-disc pl-4 space-y-1"},R.check.map(((e,t)=>React.createElement("li",{key:t},e[i]))))),React.createElement("div",{className:"text-[10px] font-bold uppercase tracking-wide "+MUTED},i?"บันไดการปิดกั้นเนฟรอนตามลำดับ":"Sequential nephron blockade ladder"),R.steps.map(((e,t)=>React.createElement(Fold,{key:t,title:e.t[i],color:e.c},React.createElement("div",{className:"flex gap-1 mb-1.5"},e.segs.map((e=>React.createElement("span",{key:e,className:"rou n = 23) or HCTZ 50 mg alone (n = 22) until discharge.","45 ราย ผู้ป่วยในหัวใจล้มเหลว EF ต่ำและดื้อยาขับปัสสาวะ สุ่มให้ triamterene 50 mg + HCTZ 25 mg (n = 23) หรือ HCTZ 50 mg อย่างเดียว (n = 22) จนจำหน่าย"],["Weight change −6.3 vs −4.8 kg (P = 0.1) and input-to-output change not different (P = 0.4); secondary outcomes similar. The study did not support triamterene as add-on.","น้ำหนักเปลี่ยน −6.3 เทียบ −4.8 กก. (P = 0.1) และอัตราส่วนน้ำเข้า-ออกไม่ต่างกัน (P = 0.4) ผลรองใกล้เคียงกัน การศึกษานี้ไม่สนับสนุนการเสริม triamterene"]),knauf:T("Xipamide vs spironolactone + furosemide (cirrhotic ascites)","Knauf H, et al. Klin Wochenschr 1990;68:545","2198378","10.1007/BF01667146",["22 patients with cirrhotic ascites after salt and water restriction, randomised to xipamide 20 mg/day or spironolactone 200 mg + furosemide 40 mg on alternate days.","22 ราย ตับแข็งมีท้องมานหลังจำกัดเกลือและน้ำ สุ่มให้ xipamide 20 มก./วัน หรือ spironolactone 200 มก. + furosemide 40 มก. วันเว้นวัน"],["Response in the first 4 days 7/11 vs 3/11; 7/11 of the combination group responded by day 8. Response depended on pretreatment FENa (resistance if < 0.2%). Xipamide often caused hypokalemia; the combination caused hyperkalemia. Kidney function stable.","ตอบสนองใน 4 วันแรก 7/11 เทียบ 3/11 กลุ่มยาผสมตอบสนอง 7/11 เมื่อครบ 8 วัน การตอบสนองขึ้นกับ FENa ก่อนรักษา (ดื้อถ้า < 0.2%) xipamide ทำให้โพแทสเซียมต่ำบ่อย ส่วนยาผสมทำให้โพแทสเซียมสูง การทำงานของไตคงที่"]),bolondi:T("Potassium canrenoate in pre-ascitic cirrhosis","Bolondi L, et al. Clin Gastroenterol Hepatol 2006;4:1395","16931172","10.1016/j.cgh.2006.06.005",["120 patients with Child-Pugh A viral cirrhosis and portal hypertension without ascites, double-blind: potassium canrenoate 100 mg/day (n = 66) or placebo (n = 54) for 52 weeks (13 Italian centres).","120 ราย ตับแข็ง Child-Pugh A จากไวรัสที่มีความดันพอร์ทัลสูงแต่ไม่มีท้องมาน double-blind: potassium canrenoate 100 มก./วัน (n = 66) หรือยาหลอก (n = 54) นาน 52 สัปดาห์ (13 ศูนย์ในอิตาลี)"],["Ascites (1.5% vs 9.2%) and variceal progression (12.1% vs 24.1%) were not significantly different alone; the combined endpoint was lower on canrenoate (17.6% vs 38.3%, P < 0.05). Well tolerated. Authors call it preliminary.","ท้องมาน (1.5% เทียบ 9.2%) และหลอดอาหารโป่งพองลุกลาม (12.1% เทียบ 24.1%) ไม่ต่างกันเมื่อแยกวิเคราะห์ แต่จุดรวมต่ำกว่าในกลุ่ม canrenoate (17.6% เทียบ 38.3%, P < 0.05) ทนยาได้ดี ผู้วิจัยระบุว่าเป็นผลเบื้องต้น"]),azoRct:T("Azosemide vs furosemide (edema)","Zhang Y, et al. Zhejiang Da Xue Xue Bao Yi Xue Ban 2005;34:459","16216060","10.3785/j.issn.1008-9292.2005.05.016",["223 patients with cardiac, hepatic or renal edema: azosemide 30–60 mg/day vs furosemide 20–40 mg/day for 2 weeks (multicentre, randomised, double-blind).","223 ราย บวมจากหัวใจ ตับ หรือไต: azosemide 30–60 mg/วัน เทียบ furosemide 20–40 mg/วัน 2 สัปดาห์ (หลายศูนย์ randomised double-blind)"],["Weight loss 2.87 vs 2.81 kg; edema response 89.2% vs 89.8%; adverse events 23.0% vs 21.0% (hypokalemia, hyperuricemia, hypertriglyceridemia, thirst): similar efficacy.","น้ำหนักลด 2.87 เทียบ 2.81 กก. ตอบสนองต่อบวม 89.2% เทียบ 89.8% เหตุการณ์ไม่พึงประสงค์ 23.0% เทียบ 21.0% (โพแทสเซียมต่ำ ยูริกสูง ไตรกลีเซอไรด์สูง กระหายน้ำ) ประสิทธิผลใกล้เคียงกัน"]),harada:T("Torasemide vs azosemide (chronic HF)","Harada K, et al. J Cardiovasc Pharmacol 2009;53:468","19430310","10.1097/FJC.0b013e3181a717f7",["30 patients with chronic HF (asymptomatic or mildly symptomatic), crossover: torasemide 8 mg/day vs azosemide 60 mg/day, 3 months each.","30 ราย หัวใจล้มเหลวเรื้อรัง (ไม่มีอาการหรืออาการน้อย) crossover: torasemide 8 mg/วัน เทียบ azosemide 60 mg/วัน ชนิดละ 3 เดือน"],["Torasemide lowered LV systolic wall stress (259 to 232 kdyn/cm²) and plasma aldosterone (133 to 95 pg/mL) with no change in norepinephrine; with azosemide norepinephrine rose (370 to 481 pg/mL) and wall stress did not change.","torasemide ลดความเครียดผนังหัวใจห้องล่างซ้ายช่วงซิสโทลี (259 เป็น 232 kdyn/cm²) และอัลโดสเตอโรน (133 เป็น 95 pg/mL) โดย norepinephrine ไม่เปลี่ยน ส่วน azosemide ทำให้ norepinephrine เพิ่ม (370 เป็น 481 pg/mL) และความเครียดผนังหัวใจไม่เปลี่ยน"]),ricci:T("Furosemide vs ethacrynic acid (infants)","Ricci Z, et al. Crit Care 2015;19:2","25563826","10.1186/s13054-014-0724-5",["74 infants after surgery for congenital heart disease: continuous infusion of furosemide vs ethacrynic acid (0.2 mg/kg/h, up to 0.8), double-blind.","74 ราย ทารกหลังผ่าตัดหัวใจพิการแต่กำเนิด: furosemide เทียบ ethacrynic acid หยดต่อเนื่อง (0.2 mg/kg/ชม. สูงสุด 0.8) double-blind"],["Urine output on day 0 6.9 vs 4.6 mL/kg/h in favour of ethacrynic acid (P = 0.002) with a smaller dose; kidney-injury markers and AKI did not differ; metabolic alkalosis was more intense with ethacrynic acid.","ปัสสาวะวันที่ 0 6.9 เทียบ 4.6 mL/kg/ชม. เป็นผลดีต่อ ethacrynic acid (P = 0.002) ด้วยขนาดยาน้อยกว่า ตัวชี้วัดไตบาดเจ็บและ AKI ไม่ต่างกัน ภาวะด่างเมตาบอลิกรุนแรงกว่าด้วย ethacrynic acid"]),excite:T("EXCITE-HT (T2DM subanalysis)","Ohishi M, et al. Hypertens Res 2026;49:444","41436637","10.1038/s41440-025-02437-z",["Subanalysis of the open-label randomised EXCITE-HT study in Japanese patients with type 2 diabetes and uncontrolled hypertension: esaxerenone vs trichlormethiazide.","การวิเคราะห์กลุ่มย่อยของ EXCITE-HT (open-label randomised) ในผู้ป่วยญี่ปุ่นที่เป็นเบาหวานชนิดที่ 2 และความดันคุมไม่ได้: esaxerenone เทียบ trichlormethiazide"],["Morning home SBP/DBP difference −2.5 (−4.8 to −0.2) / −0.7 (−2.0 to 0.6) mm Hg: similar BP lowering. Urinary ACR fell. Serum K⁺ ≥ 5.5 mEq/L in 2.5% vs 0.9%, none ≥ 6.0.","ผลต่างความดันตัวบน/ตัวล่างที่บ้านตอนเช้า −2.5 (−4.8 ถึง −0.2) / −0.7 (−2.0 ถึง 0.6) mm Hg ลดความดันใกล้เคียงกัน ACR ปัสสาวะลดลง K⁺ ≥ 5.5 mEq/L 2.5% เทียบ 0.9% ไม่มีรายใด ≥ 6.0"]),dapaResist:T("DAPA-RESIST","Yeoh SE, et al. Eur Heart J 2023;44:2966","37210742","10.1093/eurheartj/ehad341",["61 patients hospitalised for HF and resistant to IV furosemide: dapagliflozin 10 mg vs metolazone 5–10 mg once daily for 3 days (open-label).","61 ราย นอนโรงพยาบาลจาก HF และดื้อต่อ furosemide IV: dapagliflozin 10 mg เทียบ metolazone 5–10 mg วันละครั้ง 3 วัน (open-label)"],["Weight loss at 96 h 3.0 vs 3.6 kg (difference 0.65 kg, 95% CI −0.12 to 1.41; P = 0.11): dapagliflozin was not more effective. Smaller falls in Na⁺ and K⁺ and smaller rises in urea and creatinine with dapagliflozin; serious adverse events similar.","น้ำหนักลดที่ 96 ชม. 3.0 เทียบ 3.6 กก. (ต่างกัน 0.65 กก., 95% CI −0.12 ถึง 1.41; P = 0.11) dapagliflozin ไม่ได้ผลดีกว่า Na⁺ และ K⁺ ลดน้อยกว่า ยูเรียและ creatinine ขึ้นน้อยกว่าด้วย dapagliflozin เหตุการณ์ไม่พึงประสงค์รุนแรงใกล้เคียงกัน"]),bottino:T("Chlorthalidone vs HCTZ; amiloride doses","Bottino LG, et al. J Am Heart Assoc 2026;15:e047583","42669885","10.1161/JAHA.125.047583",["Factorial randomised trial, 12 weeks: chlorthalidone 25 mg vs HCTZ 50 mg, and amiloride 5 mg vs 10 mg, on office and ambulatory BP and laboratory values.","การทดลองแบบ factorial 12 สัปดาห์: chlorthalidone 25 mg เทียบ HCTZ 50 mg และ amiloride 5 mg เทียบ 10 mg ต่อความดันที่คลินิกและแบบ ambulatory และค่าตรวจเลือด"],["Chlorthalidone 25 mg and HCTZ 50 mg (1:2) lowered BP and changed laboratory values similarly (24-h systolic difference −1.1 mm Hg, 95% CI −8.0 to 5.9). Amiloride 5 and 10 mg had similar BP effects; serum Na⁺ fell more with 10 mg; no clear dose-response.","chlorthalidone 25 mg และ HCTZ 50 mg (1:2) ลดความดันและเปลี่ยนค่าตรวจเลือดใกล้เคียงกัน (ต่างกันของความดันตัวบน 24 ชม. −1.1 mm Hg, 95% CI −8.0 ถึง 5.9) amiloride 5 และ 10 mg ลดความดันใกล้เคียงกัน Na⁺ ลดมากกว่าที่ 10 mg ไม่เห็น dose-response ชัดเจน"]),dose:T("DOSE","Felker GM, et al. N Engl J Med 2011;364:797","21366472","10.1056/NEJMoa1005419",["308 patients with acute decompensated HF: IV furosemide as bolus every 12 h vs continuous infusion, and low vs high dose (2.5 × the oral dose).","308 รายที่หัวใจล้มเหลวเฉียบพลัน: furosemide IV แบบ bolus ทุก 12 ชม. เทียบกับหยดต่อเนื่อง และขนาดต่ำเทียบขนาดสูง (2.5 เท่าของขนาดกินเดิม)"],["No significant difference in symptoms or creatinine change for bolus vs infusion, or high vs low dose. High dose: trend to better symptom score (P = 0.06) and more diuresis, but transient worsening of renal function.","ไม่ต่างกันอย่างมีนัยสำคัญด้านอาการหรือการเปลี่ยนแปลง creatinine ระหว่าง bolus กับหยดต่อเนื่อง หรือขนาดสูงกับขนาดต่ำ ขนาดสูงมีแนวโน้มอาการดีกว่า (P = 0.06) ขับปัสสาวะมากกว่า แต่ไตเสื่อมชั่วคราว"]),transform:T("TRANSFORM-HF","Mentz RJ, et al. JAMA 2023;329:214","36648467","10.1001/jama.2022.23924",["2,859 patients discharged after a heart failure hospitalisation: torsemide vs furosemide, 12 months.","2,859 รายหลังออกจากโรงพยาบาลจากหัวใจล้มเหลว: torsemide เทียบกับ furosemide ติดตาม 12 เดือน"],["All-cause death 26.1% vs 26.2% (HR 1.02, 95% CI 0.89–1.18). Death or hospitalisation 47.3% vs 49.3% (HR 0.92, 0.83–1.02). Limited by loss to follow-up and crossover.","เสียชีวิตจากทุกสาเหตุ 26.1% เทียบ 26.2% (HR 1.02, 95% CI 0.89–1.18) เสียชีวิตหรือนอนโรงพยาบาล 47.3% เทียบ 49.3% (HR 0.92, 0.83–1.02) ข้อจำกัด: ผู้ป่วยติดตามไม่ครบและมีการเปลี่ยนกลุ่มยา"]),dcp:T("Diuretic Comparison Project","Ishani A, et al. N Engl J Med 2022;387:2401","36516076","10.1056/NEJMoa2212270",["13,523 veterans aged ≥ 65 taking HCTZ 25–50 mg: continue HCTZ or switch to chlorthalidone 12.5–25 mg (pragmatic trial).","ทหารผ่านศึก 13,523 ราย อายุ ≥ 65 ปี ที่ใช้ HCTZ 25–50 mg: ใช้ HCTZ ต่อหรือเปลี่ยนเป็น chlorthalidone 12.5–25 mg (pragmatic trial)"],["Primary outcome (MI, stroke, HF hospitalisation, urgent revascularisation, non-cancer death) 10.4% vs 10.0% (HR 1.04, 0.94–1.16): no difference. Hypokalemia 6.0% vs 4.4% (chlorthalidone vs HCTZ).","ผลลัพธ์หลัก (MI, stroke, นอนโรงพยาบาลจาก HF, revascularisation เร่งด่วน, เสียชีวิตที่ไม่ใช่มะเร็ง) 10.4% เทียบ 10.0% (HR 1.04, 0.94–1.16) ไม่ต่างกัน โพแทสเซียมต่ำ 6.0% เทียบ 4.4% (chlorthalidone เทียบ HCTZ)"]),clorotic:T("CLOROTIC","Trullàs JC, et al. Eur Heart J 2023;44:411","36423214","10.1093/eurheartj/ehac689",["230 patients (mean age 83) with acute HF: HCTZ or placebo added to IV furosemide.","230 ราย (อายุเฉลี่ย 83 ปี) หัวใจล้มเหลวเฉียบพลัน: เพิ่ม HCTZ หรือยาหลอกร่วมกับ furosemide IV"],["Weight loss at 72 h 2.3 vs 1.5 kg (P = 0.002) and more 24-h diuresis; no difference in dyspnea score. Worse renal function more often with HCTZ (46.5% vs 17.2%). No difference in mortality or rehospitalisation.","น้ำหนักลดที่ 72 ชม. 2.3 เทียบ 1.5 กก. (P = 0.002) ปัสสาวะ 24 ชม. มากกว่า คะแนนเหนื่อยไม่ต่างกัน ไตเสื่อมพบบ่อยกว่าในกลุ่ม HCTZ (46.5% เทียบ 17.2%) การเสียชีวิตและการนอนโรงพยาบาลซ้ำไม่ต่างกัน"]),click:T("CLICK","Agarwal R, et al. N Engl J Med 2021;385:2507","34739197","10.1056/NEJMoa2110730",["Stage 4 CKD with poorly controlled hypertension: chlorthalidone (12.5 mg, up to 50 mg) vs placebo for 12 weeks.","CKD ระยะ 4 ที่ความดันคุมไม่ดี: chlorthalidone (เริ่ม 12.5 mg สูงสุด 50 mg) เทียบกับยาหลอก 12 สัปดาห์"],["24-h systolic BP −10.5 mm Hg vs placebo (95% CI −14.6 to −6.4). Albumin-to-creatinine ratio 50 percentage points lower. More hypokalemia, reversible creatinine rise, hyperglycemia and hyperuricemia.","ความดันตัวบน 24 ชม. ลดลงมากกว่ายาหลอก 10.5 mm Hg (95% CI −14.6 ถึง −6.4) อัตราส่วนอัลบูมิน/ครีเอตินินลดลงมากกว่า 50 จุดร้อยละ พบโพแทสเซียมต่ำ creatinine ขึ้นชั่วคราว น้ำตาลสูง และยูริกสูงบ่อยกว่า"]),allhat:T("ALLHAT","ALLHAT Collaborative Research Group. JAMA 2002;288:2981","12479763","10.1001/jama.288.23.2981",["33,357 high-risk hypertensive patients aged ≥ 55: chlorthalidone vs amlodipine vs lisinopril.","ผู้ป่วยความดันสูงเสี่ยงสูง 33,357 ราย อายุ ≥ 55 ปี: chlorthalidone เทียบ amlodipine เทียบ lisinopril"],["Fatal CHD or non-fatal MI: amlodipine RR 0.98 (0.90–1.07) and lisinopril RR 0.99 (0.91–1.08) vs chlorthalidone. Heart failure was higher with amlodipine (RR 1.38) and lisinopril (RR 1.19).","โรคหลอดเลือดหัวใจเสียชีวิตหรือ MI ไม่เสียชีวิต: amlodipine RR 0.98 (0.90–1.07) และ lisinopril RR 0.99 (0.91–1.08) เทียบกับ chlorthalidone หัวใจล้มเหลวพบมากกว่าด้วย amlodipine (RR 1.38) และ lisinopril (RR 1.19)"]),hyvet:T("HYVET","Beckett NS, et al. N Engl J Med 2008;358:1887","18378519","10.1056/NEJMoa0801369",["3,845 patients aged ≥ 80 with systolic BP ≥ 160 mm Hg: indapamide SR 1.5 mg (perindopril added if needed) vs placebo.","3,845 ราย อายุ ≥ 80 ปี ความดันตัวบน ≥ 160 mm Hg: indapamide SR 1.5 mg (เพิ่ม perindopril ถ้าจำเป็น) เทียบกับยาหลอก"],["BP 15.0/6.1 mm Hg lower. Stroke −30% (P = 0.06), all-cause death −21% (P = 0.02), heart failure −64% (P < 0.001). Fewer serious adverse events.","ความดันลดลง 15.0/6.1 mm Hg stroke ลด 30% (P = 0.06) เสียชีวิตทุกสาเหตุลด 21% (P = 0.02) หัวใจล้มเหลวลด 64% (P < 0.001) เหตุการณ์ไม่พึงประสงค์รุนแรงน้อยกว่า"]),progress:T("PROGRESS","PROGRESS Collaborative Group. Lancet 2001;358:1033","11589932","10.1016/S0140-6736(01)06178-5",["6,105 patients with previous stroke or TIA: perindopril-based regimen (indapamide added at the physician’s discretion) vs placebo.","6,105 ราย เคยเป็น stroke หรือ TIA: สูตรที่ใช้ perindopril เป็นหลัก (เพิ่ม indapamide ตามดุลยพินิจแพทย์) เทียบกับยาหลอก"],["Stroke reduced 28% (95% CI 17–38). Perindopril + indapamide: BP −12/5 mm Hg and stroke −43%; perindopril alone: no clear stroke reduction.","stroke ลด 28% (95% CI 17–38) perindopril + indapamide: ความดันลด 12/5 mm Hg และ stroke ลด 43% perindopril เดี่ยว: ไม่เห็นการลด stroke ชัดเจน"]),advance:T("ADVANCE","Patel A, et al. Lancet 2007;370:829","17765963","10.1016/S0140-6736(07)61303-8",["11,140 patients with type 2 diabetes: fixed perindopril–indapamide vs placebo on top of usual therapy.","11,140 ราย เบาหวานชนิดที่ 2: perindopril–indapamide แบบรวมเม็ดเทียบกับยาหลอก เสริมจากการรักษาเดิม"],["Major macro- or microvascular event HR 0.91 (0.83–1.00); CV death HR 0.82 (0.68–0.98); all-cause death HR 0.86 (0.75–0.98).","หลอดเลือดขนาดใหญ่หรือเล็กผิดปกติรุนแรง HR 0.91 (0.83–1.00) เสียชีวิตจากหัวใจและหลอดเลือด HR 0.82 (0.68–0.98) เสียชีวิตทุกสาเหตุ HR 0.86 (0.75–0.98)"]),rales:T("RALES","Pitt B, et al. N Engl J Med 1999;341:709","10471456","10.1056/NEJM199909023411001",["1,663 patients with severe HF (LVEF ≤ 35%) on an ACE inhibitor and a loop diuretic: spironolactone 25 mg vs placebo.","1,663 ราย หัวใจล้มเหลวรุนแรง (LVEF ≤ 35%) ที่ได้ ACEi และยาลูป: spironolactone 25 mg เทียบกับยาหลอก"],["Death 35% vs 46% (RR 0.70, 0.60–0.82). Stopped early after a mean of 24 months.","เสียชีวิต 35% เทียบ 46% (RR 0.70, 0.60–0.82) หยุดการศึกษาก่อนกำหนดที่เฉลี่ย 24 เดือน"]),topcat:T("TOPCAT","Pitt B, et al. N Engl J Med 2014;370:1383","24716680","10.1056/NEJMoa1313731",["3,445 patients with HF and LVEF ≥ 45%: spironolactone 15–45 mg vs placebo, mean 3.3 years.","3,445 ราย หัวใจล้มเหลวที่ LVEF ≥ 45%: spironolactone 15–45 mg เทียบกับยาหลอก เฉลี่ย 3.3 ปี"],["CV death, aborted cardiac arrest or HF hospitalisation 18.6% vs 20.4% (HR 0.89, 0.77–1.04, P = 0.14): not significant.","เสียชีวิตจากหัวใจ หัวใจหยุดเต้นที่กู้ได้ หรือนอนโรงพยาบาลจาก HF 18.6% เทียบ 20.4% (HR 0.89, 0.77–1.04, P = 0.14) ไม่มีนัยสำคัญ"]),athena:T("ATHENA-HF","Butler J, et al. JAMA Cardiol 2017","28700781","10.1001/jamacardio.2017.2198",["360 patients with acute HF: high-dose spironolactone for 96 h vs usual care.","360 ราย หัวใจล้มเหลวเฉียบพลัน: spironolactone ขนาดสูง 96 ชม. เทียบกับการรักษาปกติ"],["NT-proBNP fall did not differ (−0.55 vs −0.49 log units, P = 0.57); no difference in day-30 death or HF hospitalisation. Well tolerated, similar potassium and eGFR changes.","NT-proBNP ลดลงไม่ต่างกัน (−0.55 เทียบ −0.49 log, P = 0.57) การเสียชีวิตหรือนอนโรงพยาบาลจาก HF ที่ 30 วันไม่ต่างกัน ทนยาได้ดี โพแทสเซียมและ eGFR เปลี่ยนใกล้เคียงกัน"]),pathway2:T("PATHWAY-2","Williams B, et al. Lancet 2015;386:2059","26414968","10.1016/S0140-6736(15)00257-3",["Resistant hypertension despite 3 drugs: crossover of spironolactone 25–50 mg, bisoprolol, doxazosin and placebo, 12 weeks each.","ความดันสูงดื้อยาแม้ได้ยา 3 ชนิด: crossover spironolactone 25–50 mg, bisoprolol, doxazosin และยาหลอก ชนิดละ 12 สัปดาห์"],["Home systolic BP −8.70 mm Hg vs placebo (95% CI −9.72 to −7.69), superior to the mean of the other two active drugs.","ความดันตัวบนที่บ้านลด 8.70 mm Hg เทียบกับยาห
